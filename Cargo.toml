# Humaux Thread workspace — §58 是 workspace contract，不是示意图。
# members 至少 crates/* 与 bins/*（§58 冻结）；xtask 为工程门禁工具（§78）。
[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
# ADR-0073 D-C: no licence is declared while cloud-to-be code lives here; the Apache-2.0 LICENSE lands in the
# open-source repository at the split (M24-14). Nothing here is published to a registry.
publish = false
# ADR-0050 D-G: declared MSRV (§70). Enforced pin is rust-toolchain.toml; every member declares
# `rust-version.workspace = true` (ADR-0051 D-L, closed the ADR-0050 open item).
rust-version = "1.99"
repository = "https://github.com/luogangan7-lgtm/humaux-thread"

[workspace.lints.clippy]
too_many_lines = "warn"
# §78.4 names `excessive_nesting` as the nesting signal and asks for deny; `cognitive_complexity` is rejected
# there. The lint only fires past `clippy.toml`'s `excessive-nesting-threshold`, and every site already past it
# carries a reasoned `#[allow(clippy::excessive_nesting)]` (G-M01-8): a new deep block without one is red here,
# a new allow is red in `cargo xtask architecture-check` (the count is pinned in xtask/known_red.toml).
excessive_nesting = "deny"
