migration_id = "0309_identity_route_generation"
class = "EXPAND_CONTRACT"
precheck = """
select to_regprocedure('control.api_key_lookup(text)') is not null
 and to_regprocedure('control.api_key_touch_last_used(uuid)') is not null
 and to_regprocedure('control.api_key_touch_last_used_batch(uuid[],integer)') is null
 as precheck_ok
"""
postcheck = """
with gateway_doors as (
  select * from pg_proc where oid in (
    to_regprocedure('control.api_key_lookup(text)'),
    to_regprocedure('control.api_key_touch_last_used_batch(uuid[],integer)')
  )
), epoch_triggers as (
  select tgname from pg_trigger
   where not tgisinternal and tgrelid in ('control.api_keys'::regclass, 'control.tenants'::regclass)
     and tgname in ('api_keys_route_epoch_update','api_keys_route_epoch_delete','tenants_route_epoch_update')
     and tgenabled = 'O'
)
select (select count(*) = 2 from gateway_doors
          where prosecdef and proowner = 'role_migration_owner'::regrole
            and has_function_privilege('role_gateway', oid, 'EXECUTE'))
 and not exists (select 1 from gateway_doors,
  lateral aclexplode(coalesce(proacl, acldefault('f', proowner))) acl
  where acl.privilege_type = 'EXECUTE' and acl.grantee not in (proowner, 'role_gateway'::regrole))
 and (select count(*) = 3 from epoch_triggers)
 and exists (select 1 from pg_attribute where attrelid = 'control.tenants'::regclass
  and attname = 'routing_revoke_epoch' and atttypid = 'bigint'::regtype and attnotnull)
 as postcheck_ok
"""
