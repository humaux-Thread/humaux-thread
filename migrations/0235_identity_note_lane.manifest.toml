# §46.1 migration manifest. ADR-0067 (card 40a, memory.note_put): private.memory_records.note_kind (nullable, closed nine-value
# CHECK + the note_kind -> memory_type CHECK), the identity contract table private.identity_note_materializations (FORCE RLS,
# evidence_affects' tenant + parent-Evidence policy, owner role_migration_owner, gateway SELECT+INSERT, private_worker and
# maintenance SELECT), a BEFORE INSERT trigger on private.memory_evidence that gives a contracted Evidence exactly one PRIMARY
# output, a BEFORE INSERT trigger on ops.outbox that settles a contracted Evidence's EVIDENCE_ACCEPTED row at birth, and 0164's
# ops.enqueue_derived_distill_work() replaced to skip a contracted Evidence, and 0164's ops.enqueue_derived_consolidate_work()
# replaced to skip a note's Memory (note_kind set). No DML; no existing policy or
# grant altered. §46 forward-fix (EXPAND_CONTRACT, first free number after 0234).

migration_id = "0235_identity_note_lane"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('private.memory_records') is not null
 and to_regclass('private.evidence_objects') is not null
 and to_regclass('private.memory_evidence') is not null
 and to_regprocedure('ops.enqueue_derived_distill_work()') is not null
 and to_regprocedure('ops.enqueue_derived_consolidate_work()') is not null
 and to_regclass('private.identity_note_materializations') is null
 and to_regprocedure('private.identity_note_single_output()') is null
 and to_regprocedure('ops.settle_identity_note_outbox()') is null
 and not exists (select 1 from pg_attribute
                  where attrelid = 'private.memory_records'::regclass
                    and attname = 'note_kind' and not attisdropped)
 as precheck_ok
"""

postcheck = """
select
 -- the column: nullable text, both CHECKs present, no column-level ACL of its own
 (select a.atttypid = 'text'::regtype and not a.attnotnull and a.attacl is null
    from pg_attribute a
   where a.attrelid = 'private.memory_records'::regclass
     and a.attname = 'note_kind' and not a.attisdropped)
 and exists (select 1 from pg_constraint where conrelid = 'private.memory_records'::regclass
              and conname = 'memory_records_note_kind_check')
 and exists (select 1 from pg_constraint where conrelid = 'private.memory_records'::regclass
              and conname = 'memory_records_note_kind_memory_type_check')
 -- every existing row is a non-note
 and not exists (select 1 from private.memory_records where note_kind is not null)
 -- the contract table: FORCE RLS, owner, one tenant-bound policy, both composite FKs cascade, UNIQUE output key
 and (select count(*) = 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
       where n.nspname = 'private' and c.relname = 'identity_note_materializations'
         and c.relrowsecurity and c.relforcerowsecurity
         and pg_get_userbyid(c.relowner) = 'role_migration_owner')
 and (select count(*) = 1 from pg_policies where schemaname = 'private'
         and tablename = 'identity_note_materializations'
         and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 and (select count(*) = 2 from pg_constraint
       where contype = 'f' and conrelid = 'private.identity_note_materializations'::regclass
         and confrelid <> 'control.tenants'::regclass
         and array_length(conkey, 1) = 2 and confdeltype = 'c')
 and exists (select 1 from pg_constraint where contype = 'u'
              and conrelid = 'private.identity_note_materializations'::regclass
              and conname = 'identity_note_materializations_output_key')
 -- NAMED grants
 and has_table_privilege('role_gateway', 'private.identity_note_materializations', 'INSERT')
 and has_table_privilege('role_gateway', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_gateway', 'private.identity_note_materializations', 'UPDATE')
 and not has_table_privilege('role_gateway', 'private.identity_note_materializations', 'DELETE')
 and has_table_privilege('role_private_worker', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_private_worker', 'private.identity_note_materializations', 'INSERT')
 and has_table_privilege('role_maintenance', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_maintenance', 'private.identity_note_materializations', 'INSERT')
 and not has_table_privilege('role_retrieval_worker', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_consolidation_worker', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_public_worker', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_batch_issuer', 'private.identity_note_materializations', 'SELECT')
 and not has_table_privilege('role_admin', 'private.identity_note_materializations', 'SELECT')
 -- G06 trigger: PRIMARY-only BEFORE INSERT on memory_evidence, owner function, SECURITY INVOKER
 and exists (select 1 from pg_trigger where tgname = 'identity_note_single_output'
              and tgrelid = 'private.memory_evidence'::regclass and not tgisinternal
              and tgfoid = 'private.identity_note_single_output()'::regprocedure)
 and (select count(*) = 1 from pg_proc p
       where p.oid = 'private.identity_note_single_output()'::regprocedure
         and not p.prosecdef and pg_get_userbyid(p.proowner) = 'role_migration_owner')
 -- D-B: the enqueue function now consults the contract and is still INVOKER (owner untouched: CREATE OR REPLACE keeps 0164's)
 and (select count(*) = 1 from pg_proc p
       where p.oid = 'ops.enqueue_derived_distill_work()'::regprocedure
         and not p.prosecdef and p.prosrc like '%identity_note_materializations%')
 -- D-I: the consolidate enqueue skips a note's Memory and is still INVOKER
 and (select count(*) = 1 from pg_proc p
       where p.oid = 'ops.enqueue_derived_consolidate_work()'::regprocedure
         and not p.prosecdef and p.prosrc like '%note_kind IS NULL%')
 -- the outbox settle: BEFORE INSERT, EVIDENCE_ACCEPTED only, owner function, INVOKER
 and exists (select 1 from pg_trigger where tgname = 'identity_note_outbox_settled'
              and tgrelid = 'ops.outbox'::regclass and not tgisinternal
              and (tgtype & 2) = 2 and (tgtype & 1) = 1
              and tgfoid = 'ops.settle_identity_note_outbox()'::regprocedure)
 and (select count(*) = 1 from pg_proc p
       where p.oid = 'ops.settle_identity_note_outbox()'::regprocedure
         and not p.prosecdef and pg_get_userbyid(p.proowner) = 'role_migration_owner')
 -- no grant was added on ops.outbox for the settle
 and not has_column_privilege('role_gateway', 'ops.outbox', 'status', 'INSERT')
 and exists (select 1 from pg_trigger where tgname = 'derived_distill_work_enqueue'
              and tgrelid = 'ops.outbox'::regclass and not tgisinternal)
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment: a later migration may restore 0164's two enqueue bodies, drop the memory_evidence trigger and its function, then the contract table, then the two note_kind CHECKs and the column — in that order, only after every identity note has been superseded or deleted. Grants are only ever narrowed by a later migration."
backup_restore_requirement = "standard pre-migration backup of private.memory_records (adds a nullable column and two CHECKs over rows that are all NULL; no user-row DML)."
