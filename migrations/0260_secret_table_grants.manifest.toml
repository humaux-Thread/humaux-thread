# §46.1 migration manifest. Card M02-1 (audit SEC-1): the eight control tables that hold a credential verifier (api_keys,
# sessions, email_challenges, password_reset_challenges, email_change_requests, password_credentials, recovery_codes,
# team_invitations) lose every privilege held by PUBLIC, the four workers, role_batch_issuer and role_admin. role_gateway
# and role_maintenance keep the SELECT they already hold; nothing is granted. No DML, no object altered; privileges only
# narrow, so EXPAND_CONTRACT (number 0260).

migration_id = "0260_secret_table_grants"
class = "EXPAND_CONTRACT"

# Refuses unless the eight tables and the six roles the REVOKE names all exist (a missing role would otherwise fail
# inside the REVOKE without naming the check).
precheck = """
select (select count(*) = 8 from (values ('control.api_keys'), ('control.sessions'), ('control.email_challenges'),
         ('control.password_reset_challenges'), ('control.email_change_requests'), ('control.password_credentials'),
         ('control.recovery_codes'), ('control.team_invitations')) t(name)
         where to_regclass(t.name) is not null)
   and (select count(*) = 6 from pg_roles
         where rolname in ('role_private_worker', 'role_consolidation_worker', 'role_public_worker',
                           'role_retrieval_worker', 'role_batch_issuer', 'role_admin'))
 as precheck_ok
"""

# Fails on: any of the eight tables where a non-owner role holds a verb other than SELECT for role_gateway and
# role_maintenance (table-level DELETE / TRUNCATE / TRIGGER, or table- or column-level SELECT / INSERT / UPDATE /
# REFERENCES); role_gateway or role_maintenance without SELECT; any other role, role_health_reader and PUBLIC included,
# holding any of them. The postcheck covers the effective privileges (membership inheritance counted), so a worker that
# inherits the gateway's SELECT through a role grant is red too.
postcheck = """
with t(name) as (values ('control.api_keys'), ('control.sessions'), ('control.email_challenges'),
       ('control.password_reset_challenges'), ('control.email_change_requests'), ('control.password_credentials'),
       ('control.recovery_codes'), ('control.team_invitations')),
r(role) as (values ('role_gateway'), ('role_private_worker'), ('role_consolidation_worker'), ('role_public_worker'),
       ('role_retrieval_worker'), ('role_batch_issuer'), ('role_maintenance'), ('role_admin'), ('role_health_reader')),
v(verb) as (values ('SELECT'), ('INSERT'), ('UPDATE'), ('REFERENCES'), ('DELETE'), ('TRUNCATE'), ('TRIGGER'))
select not exists (
         select 1 from t cross join r cross join v
          where (case when v.verb in ('DELETE', 'TRUNCATE', 'TRIGGER')
                      then has_table_privilege(r.role, t.name, v.verb)
                      else has_any_column_privilege(r.role, t.name, v.verb) end)
                is distinct from (v.verb = 'SELECT' and r.role in ('role_gateway', 'role_maintenance')))
   and not exists (
         select 1 from t cross join v where has_table_privilege('public', t.name, v.verb))
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only: GRANT SELECT back to the one role that proves it needs the table, in a new migration that also changes that role's cell in maintenance::rls_check and Baseline section 6.2.2. Re-granting the 0011 control.* domain default (SELECT to the four workers) re-opens SEC-1: any compromised worker could read every credential verifier."
backup_restore_requirement = "none: privileges only; no row is read, copied, rewritten or deleted."
