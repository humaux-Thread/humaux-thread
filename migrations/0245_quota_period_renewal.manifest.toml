# §46.1 migration manifest. Card W0 / ADR-0072: quota-period renewal — the staged successor period on
# control.entitlement_snapshots (two nullable columns and their pairing CHECK) and the owner door
# control.renew_quota_period (SECURITY DEFINER, search_path pg_catalog, TimeZone UTC, PUBLIC has no EXECUTE,
# role_maintenance the only non-owner EXECUTE). No table, role or table grant is added. §46 forward-fix
# (EXPAND_CONTRACT, first free number after 0244).

migration_id = "0245_quota_period_renewal"
class = "EXPAND_CONTRACT"

# Refuses a database without 0113's issuer or 0033's snapshot table, or one that already has the door or the columns.
precheck = """
select to_regprocedure('control.renew_quota_period(uuid,text,interval,interval,integer)') is null
 and to_regprocedure('control.issue_quota_window(uuid,text)') is not null
 and to_regclass('control.entitlement_snapshots') is not null
 and not exists (select 1 from pg_attribute where attrelid = 'control.entitlement_snapshots'::regclass
                  and attname in ('successor', 'successor_from') and not attisdropped)
 as precheck_ok
"""

# Fails on: a missing column or pairing CHECK, the door not owner-owned / not a definer / without its pinned
# search_path and TimeZone, EXECUTE held by PUBLIC or any role but role_maintenance, or a snapshot table that lost
# FORCE RLS.
postcheck = """
select (select count(*) = 2 from pg_attribute where attrelid = 'control.entitlement_snapshots'::regclass
         and attname in ('successor', 'successor_from') and not attisdropped)
 and exists (select 1 from pg_constraint where conrelid = 'control.entitlement_snapshots'::regclass
              and conname = 'entitlement_snapshot_successor' and contype = 'c')
 and (select c.relrowsecurity and c.relforcerowsecurity from pg_class c
       where c.oid = 'control.entitlement_snapshots'::regclass)
 and coalesce((select pg_get_userbyid(p.proowner) = 'role_migration_owner' and p.prosecdef
     and 'search_path=pg_catalog' = any(coalesce(p.proconfig, '{}'))
     and 'TimeZone=UTC' = any(coalesce(p.proconfig, '{}'))
     and has_function_privilege('role_maintenance', p.oid, 'EXECUTE')
     and not has_function_privilege('role_gateway', p.oid, 'EXECUTE')
     and not has_function_privilege('role_retrieval_worker', p.oid, 'EXECUTE')
     and not has_function_privilege('role_private_worker', p.oid, 'EXECUTE')
     and not has_function_privilege('role_consolidation_worker', p.oid, 'EXECUTE')
     and not has_function_privilege('role_public_worker', p.oid, 'EXECUTE')
     and not has_function_privilege('role_batch_issuer', p.oid, 'EXECUTE')
     and not has_function_privilege('role_admin', p.oid, 'EXECUTE')
     and not exists (select 1 from aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) x
                      where x.grantee = 0 and x.privilege_type = 'EXECUTE')
   from pg_proc p
  where p.oid = to_regprocedure('control.renew_quota_period(uuid,text,interval,interval,integer)')), false)
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only: DROP FUNCTION control.renew_quota_period(uuid,text,interval,interval,integer); then, once no snapshot has successor_from <= now() unpromoted (promote by hand: effective = successor), ALTER TABLE control.entitlement_snapshots DROP CONSTRAINT entitlement_snapshot_successor, DROP COLUMN successor_from, DROP COLUMN successor — and revert adapters::request_guard_repo's successor read in the same release."
backup_restore_requirement = "none: two nullable columns (NULL on every existing row) and one function; no existing row is changed."
