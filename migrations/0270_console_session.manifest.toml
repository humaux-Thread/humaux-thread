# §46.1 migration manifest. Card M02-6: the console session. control.sessions already carries the digest column (0040) and the
# SELECT-only grants (0260); four owner SECURITY DEFINER doors (session_issue / _lookup / _touch / _revoke, EXECUTE
# role_gateway only) are the whole write path. No table, no column, no grant on a table, no row read, rewritten or deleted
# (number 0270).

migration_id = "0270_console_session"
class = "EXPAND_CONTRACT"

# Refuses unless control.sessions has its digest column and the four doors are not already there.
precheck = """
select to_regclass('control.sessions') is not null
   and to_regclass('control.users') is not null
   and exists (select 1 from pg_attribute where attrelid = to_regclass('control.sessions')
                and attname = 'token_hash' and not attisdropped)
   and to_regprocedure('control.session_issue(uuid,bytea,integer)') is null
   and to_regprocedure('control.session_lookup(bytea)') is null
   and to_regprocedure('control.session_touch(uuid,integer)') is null
   and to_regprocedure('control.session_revoke(uuid)') is null
 as precheck_ok
"""

# Fails on: a door that is not owner-owned SECURITY DEFINER with search_path=pg_catalog; any EXECUTE on a door for a grantee
# other than the owner and role_gateway (PUBLIC included); role_gateway missing EXECUTE on any of the four.
postcheck = """
with doors(sig) as (values
  ('control.session_issue(uuid,bytea,integer)'),
  ('control.session_lookup(bytea)'),
  ('control.session_touch(uuid,integer)'),
  ('control.session_revoke(uuid)'))
select (select count(*) = 4 from doors d join pg_proc p on p.oid = to_regprocedure(d.sig)
         where p.prosecdef and pg_get_userbyid(p.proowner) = 'role_migration_owner'
           and 'search_path=pg_catalog' = any (coalesce(p.proconfig, array[]::text[])))
   and not exists (select 1 from doors d join pg_proc p on p.oid = to_regprocedure(d.sig)
                    cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
                    where a.privilege_type = 'EXECUTE' and a.grantee <> p.proowner
                      and (a.grantee = 0 or pg_get_userbyid(a.grantee) <> 'role_gateway'))
   and (select count(*) = 4 from doors d where has_function_privilege('role_gateway', to_regprocedure(d.sig), 'EXECUTE'))
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only: dropping the doors is safe once nothing calls them; no row or column depends on them."
backup_restore_requirement = "none: four functions only; no row is read, copied, rewritten or deleted."
