# §46.1 migration manifest. ADR-0067 D-J as adjudicated (card 40c-1, memory.note_put replacement): private.memory_records.note_id
# (nullable uuid, CHECK note_id IS NOT NULL iff note_kind IS NOT NULL, a deferred EXCLUDE of one active version per
# (tenant_id, note_id)), the lock-anchor table private.note_heads (FORCE RLS, tenant-only policy — see 0236.sql on EvalPlanQual —, owner
# role_migration_owner, gateway SELECT+INSERT+UPDATE(head_memory_id), maintenance SELECT, composite cascading FK to
# memory_records (tenant_id, memory_id)), and control.confirm_tokens.request_sha256 (nullable 32-byte digest). Backfill DML:
# every 40a note becomes a singleton (note_id = memory_id, one head row = itself) — allowed as a forward-fix of a lane never
# deployed (merge != go-live); the precheck refuses a note that already has a supersession edge in or out. §46 forward-fix
# (EXPAND_CONTRACT, first free number after 0235).

migration_id = "0236_note_replacement"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('private.memory_records') is not null
 and to_regclass('control.confirm_tokens') is not null
 and to_regclass('private.note_heads') is null
 and exists (select 1 from pg_attribute
              where attrelid = 'private.memory_records'::regclass
                and attname = 'note_kind' and not attisdropped)
 and not exists (select 1 from pg_attribute
                  where attrelid = 'private.memory_records'::regclass
                    and attname = 'note_id' and not attisdropped)
 and not exists (select 1 from pg_attribute
                  where attrelid = 'control.confirm_tokens'::regclass
                    and attname = 'request_sha256' and not attisdropped)
 and exists (select 1 from pg_constraint
              where conrelid = 'private.memory_records'::regclass and contype = 'u'
                and conname = 'memory_records_tenant_id_unique')
 -- the singleton backfill is only true of notes with no supersession edge in or out
 and not exists (select 1 from private.memory_records m
                  where m.note_kind is not null
                    and (m.superseded_by is not null
                         or exists (select 1 from private.memory_records s
                                     where s.superseded_by = m.memory_id)))
 as precheck_ok
"""

postcheck = """
select
 -- the column: nullable uuid with no column-level ACL, the iff-CHECK and the deferred one-active EXCLUDE
 (select a.atttypid = 'uuid'::regtype and not a.attnotnull and a.attacl is null
    from pg_attribute a
   where a.attrelid = 'private.memory_records'::regclass
     and a.attname = 'note_id' and not a.attisdropped)
 and exists (select 1 from pg_constraint where conrelid = 'private.memory_records'::regclass
              and contype = 'c' and conname = 'memory_records_note_id_iff_note_kind')
 and exists (select 1 from pg_constraint where conrelid = 'private.memory_records'::regclass
              and contype = 'x' and conname = 'memory_records_one_active_note_version'
              and condeferrable and condeferred)
 -- the backfill: every note has a note_id, every note_id has its head row, every head is a version of its note
 and not exists (select 1 from private.memory_records where (note_id is null) <> (note_kind is null))
 and not exists (select 1 from private.memory_records m
                  where m.note_id is not null
                    and not exists (select 1 from private.note_heads h
                                     where h.tenant_id = m.tenant_id and h.note_id = m.note_id))
 and not exists (select 1 from private.note_heads h
                  join private.memory_records m
                    on m.tenant_id = h.tenant_id and m.memory_id = h.head_memory_id
                 where m.note_id is distinct from h.note_id)
 -- the head table: FORCE RLS, owner, one tenant-bound policy, one cascading composite FK to memory_records
 and (select count(*) = 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
       where n.nspname = 'private' and c.relname = 'note_heads'
         and c.relrowsecurity and c.relforcerowsecurity
         and pg_get_userbyid(c.relowner) = 'role_migration_owner')
 and (select count(*) = 1 from pg_policies where schemaname = 'private'
         and tablename = 'note_heads'
         and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 and (select count(*) = 1 from pg_constraint
       where contype = 'f' and conrelid = 'private.note_heads'::regclass
         and confrelid = 'private.memory_records'::regclass
         and array_length(conkey, 1) = 2 and confdeltype = 'c')
 -- NAMED grants
 and has_table_privilege('role_gateway', 'private.note_heads', 'SELECT')
 and has_table_privilege('role_gateway', 'private.note_heads', 'INSERT')
 and not has_table_privilege('role_gateway', 'private.note_heads', 'UPDATE')
 and has_column_privilege('role_gateway', 'private.note_heads', 'head_memory_id', 'UPDATE')
 and not has_column_privilege('role_gateway', 'private.note_heads', 'note_id', 'UPDATE')
 and not has_column_privilege('role_gateway', 'private.note_heads', 'tenant_id', 'UPDATE')
 and not has_table_privilege('role_gateway', 'private.note_heads', 'DELETE')
 and has_table_privilege('role_maintenance', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_maintenance', 'private.note_heads', 'INSERT')
 and not has_table_privilege('role_private_worker', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_retrieval_worker', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_consolidation_worker', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_public_worker', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_batch_issuer', 'private.note_heads', 'SELECT')
 and not has_table_privilege('role_admin', 'private.note_heads', 'SELECT')
 -- the token intent column: nullable bytea, 32-byte CHECK, no grant change on confirm_tokens
 and (select a.atttypid = 'bytea'::regtype and not a.attnotnull and a.attacl is null
        from pg_attribute a
       where a.attrelid = 'control.confirm_tokens'::regclass
         and a.attname = 'request_sha256' and not a.attisdropped)
 and exists (select 1 from pg_constraint where conrelid = 'control.confirm_tokens'::regclass
              and contype = 'c' and pg_get_constraintdef(oid) like '%request_sha256%')
 and not has_column_privilege('role_gateway', 'control.confirm_tokens', 'request_sha256', 'UPDATE')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment: a later migration may drop control.confirm_tokens.request_sha256 (only once no unexpired note token exists), then private.note_heads, then the EXCLUDE, the CHECK and private.memory_records.note_id — in that order, only after every note has been folded back to one version. Grants are only ever narrowed by a later migration."
backup_restore_requirement = "standard pre-migration backup of private.memory_records and control.confirm_tokens (adds nullable columns, a CHECK and a deferred EXCLUDE; the DML only stamps note_id on note rows and inserts one head row per note)."
