# §46.1 migration manifest. Card 36 S4 / ADR-0063 D-B, D-D: control.audit_events converted to a RANGE (occurred_at)
# parent with one leaf adopted from the heap and the current UTC month plus 3 pre-created; its inbound FK re-pointed to
# control.audit_event_identity; audit_seq restarted above the legacy maximum.
# ADR-0063 D-D 7b: catalog-only checks through to_regclass text lookups, so migration-rehearsal can EXPLAIN them
# against HEAD; the row-count, identity-position and fingerprint comparisons are the body's own last DO block (7a).

migration_id = "0229_partition_audit_events"
class = "FORWARD_ONLY"

# ADR-0082 / #137: the body's F3 precheck now orders its aggregate by the expression (it sorted by the constant 1).
# Only a precheck and a comment changed, no schema effect; the listed checksum is the file as merged before this
# change, which databases that already applied it recorded. `migrate` accepts it, logs it and never rewrites the row.
accepted_prior_checksums = [
  { checksum = "e9e52faff81ba4d6", reason = "#137 aggregate ORDER BY constant" },
]

# Refuses unless control.audit_events is still a plain heap that no view or BEGIN ATOMIC body depends on, exactly the
# operation receipt FK references it, its audit_seq is still an identity column, and the 0224 creator exists. Orphan
# counts per FK are the body's own first DO block (it names the FK and the count).
precheck = """
select coalesce((select c.relkind = 'r' from pg_class c where c.oid = to_regclass('control.audit_events')), false)
 and to_regprocedure('control.partition_create_month(text,timestamptz)') is not null
 and not exists (select 1 from pg_depend d
                  where d.refobjid = to_regclass('control.audit_events')
                    and d.classid in ('pg_rewrite'::regclass, 'pg_proc'::regclass))
 and (select array_agg(co.conname::text order by co.conname) from pg_constraint co
       where co.contype = 'f' and co.confrelid = to_regclass('control.audit_events') and co.conparentid = 0)
     = array['operation_receipts_audit_event_id_fkey']
 and exists (select 1 from pg_attribute a
              where a.attrelid = to_regclass('control.audit_events') and a.attname = 'audit_seq'
                and a.attidentity = 'a')
 and to_regclass('control.audit_event_identity') is null
 as precheck_ok
"""

# Fails on: not a RANGE parent; a DEFAULT partition; a leaf not owned by role_migration_owner, without RLS + FORCE,
# with a policy set other than the parent's, or with any ACL entry for another role (table or column); registry
# ATTACHED rows not equal to pg_inherits; a horizon short of the current UTC month + 4; an FK into the parent; the
# receipt FK not on control.audit_event_identity; the identity table without RLS + FORCE or with a runtime grant;
# audit_seq no longer an identity column; the claim trigger or either append-only guard missing on the parent.
postcheck = """
select
 coalesce((select c.relkind = 'p' from pg_class c where c.oid = to_regclass('control.audit_events')), false)
 and (select count(*) >= 4 from pg_inherits i where i.inhparent = to_regclass('control.audit_events'))
 and not exists (
       select 1 from pg_inherits i join pg_class l on l.oid = i.inhrelid
        where i.inhparent = to_regclass('control.audit_events')
          and (pg_get_expr(l.relpartbound, l.oid) = 'DEFAULT'
               or not l.relrowsecurity or not l.relforcerowsecurity
               or pg_get_userbyid(l.relowner) <> 'role_migration_owner'
               or exists (select 1 from aclexplode(coalesce(l.relacl, acldefault('r', l.relowner))) x
                           where x.grantee <> l.relowner)
               or exists (select 1 from pg_attribute a, aclexplode(a.attacl) x where a.attrelid = l.oid)
               or (select array_agg(format('%s %s %s %s %s %s', p.polname, p.polcmd, p.polpermissive, p.polroles,
                                           pg_get_expr(p.polqual, i.inhparent), pg_get_expr(p.polwithcheck, i.inhparent))
                                    order by p.polname)
                     from pg_policy p where p.polrelid = l.oid)
                  is distinct from
                  (select array_agg(format('%s %s %s %s %s %s', p.polname, p.polcmd, p.polpermissive, p.polroles,
                                           pg_get_expr(p.polqual, p.polrelid), pg_get_expr(p.polwithcheck, p.polrelid))
                                    order by p.polname)
                     from pg_policy p where p.polrelid = to_regclass('control.audit_events'))))
 and (select array_agg(i.inhrelid order by i.inhrelid) from pg_inherits i
       where i.inhparent = to_regclass('control.audit_events'))
     = (select array_agg(r.leaf_oid order by r.leaf_oid) from control.partition_registry r
         where r.table_key = 'AUDIT_EVENTS' and r.state = 'ATTACHED')
 and (select max(r.upper_bound) from control.partition_registry r
       where r.table_key = 'AUDIT_EVENTS' and r.state = 'ATTACHED')
     >= date_add(date_trunc('month', now(), 'UTC'), interval '4 months', 'UTC')
 and not exists (select 1 from pg_constraint co
                  where co.contype = 'f' and co.confrelid = to_regclass('control.audit_events'))
 and (select array_agg(format('%s %s', co.conrelid::regclass, co.conname) order by co.conname)
        from pg_constraint co
       where co.contype = 'f' and co.confrelid = to_regclass('control.audit_event_identity') and co.conparentid = 0)
     = array['control.operation_receipts operation_receipts_audit_event_id_fkey']
 and coalesce((select c.relrowsecurity and c.relforcerowsecurity
                 and not exists (select 1 from aclexplode(coalesce(c.relacl, acldefault('r', c.relowner))) x
                                  where x.grantee <> c.relowner)
                 from pg_class c where c.oid = to_regclass('control.audit_event_identity')), false)
 and exists (select 1 from pg_attribute a
              where a.attrelid = to_regclass('control.audit_events') and a.attname = 'audit_seq'
                and a.attidentity = 'a')
 and (select array_agg(t.tgname::text order by t.tgname) from pg_trigger t
       where t.tgrelid = to_regclass('control.audit_events') and not t.tgisinternal)
     = array['audit_events_identity_claim', 'audit_events_identity_release', 'audit_events_reject_mutation',
             'audit_events_reject_truncate']
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix only (FORWARD_ONLY, §46.1; no fake down migration). Before COMMIT any failure rolls the single transaction back and leaves the heap untouched. After COMMIT: restore the pre-apply pg_dump into a fresh database and swap names (ADR-0063 D-M runbook), or a forward migration."
backup_restore_requirement = "pg_dump before apply (ADR-0063 D-M): the heap's own relfilenode becomes the leaf; no row is copied, rewritten or deleted; the body's last DO block refuses any count, identity-count, audit_seq-position or catalog-fingerprint drift."
