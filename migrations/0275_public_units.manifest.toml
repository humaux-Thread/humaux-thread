# §46.1 / M20-7: additive schema, no existing revision rewrite.
migration_id = "0275_public_units"
class = "EXPAND_CONTRACT"
precheck = """
SELECT to_regclass('public.syntheses') IS NOT NULL
 AND to_regclass('public.units') IS NULL
 AND to_regclass('public.unit_fields') IS NULL
 AND to_regclass('public.unit_conditions') IS NULL AS precheck_ok
"""
postcheck = """
SELECT (SELECT count(*)=3 FROM pg_class WHERE oid IN
 ('public.units'::regclass,'public.unit_fields'::regclass,'public.unit_conditions'::regclass)
 AND relowner='role_migration_owner'::regrole)
 AND (SELECT count(*)=6 FROM pg_constraint WHERE contype='c'
 AND conrelid IN ('public.units'::regclass,'public.unit_fields'::regclass))
 AND EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid='public.syntheses'::regclass
 AND confrelid='public.units'::regclass AND contype='f')
 AND (SELECT count(*)=1 FROM pg_index
     WHERE indexrelid=to_regclass('public.unit_conditions_identity_uq')
       AND indrelid='public.unit_conditions'::regclass AND indisunique)
 AND EXISTS (SELECT 1 FROM pg_constraint c
     JOIN pg_attribute a ON a.attrelid=c.conrelid AND a.attnum=c.conkey[1]
     WHERE c.conrelid='public.unit_conditions'::regclass AND c.contype='p'
       AND cardinality(c.conkey)=1 AND a.attname='condition_id') AS postcheck_ok
"""
rollback_or_forward_fix = "Forward-fix after any unit rows exist; preserve revisions and fields. Before use, drop the three new tables and syntheses.unit_id in reverse FK order."
