# §46.1 migration manifest. Card M19-2 / ADR-0092 D-A: control.deletion_requests v1 (one row per stream_seq, 0054) becomes the v2
# request row (scope_kind in five values, requested_by, manifest_hash, confirm_token_id, logical_deleted_at; the four stream-key
# columns are dropped), the new control.deletion_targets holds the frozen closure, and one owner SECURITY DEFINER door
# (control.deletion_request_freeze, EXECUTE role_gateway only) is its write path. No DELETE or write grant on either table for any
# runtime role. DROP COLUMN on a table that holds no row (§46 forward-fix, EXPAND_CONTRACT, number 0272).

migration_id = "0272_deletion_requests_v2"
class = "EXPAND_CONTRACT"

# Refuses a database whose deletion_requests is not the 0054/0055 v1 shape, one that already carries 0272, or one that holds ANY v1
# row (M19 D1: "0 rows, refuse otherwise"; the SQL file also raises '0272: control.deletion_requests holds v1 per-seq rows; M19 D1
# requires 0 rows, refusing to migrate').
precheck = """
select (select set_config('row_security', 'off', true)) = 'off'
 and to_regclass('control.deletion_requests') is not null
 and to_regclass('control.deletion_targets') is null
 and to_regprocedure('control.deletion_request_freeze(uuid,text,uuid[])') is null
 and exists (select 1 from pg_attribute where attrelid = to_regclass('control.deletion_requests')
              and attname = 'stream_seq' and not attisdropped)
 and not exists (select 1 from pg_attribute where attrelid = to_regclass('control.deletion_requests')
                  and attname = 'manifest_hash' and not attisdropped)
 and not exists (select 1 from control.deletion_requests)
 as precheck_ok
"""

# Also fails on: a runtime role holding anything but SELECT on deletion_targets (gateway and maintenance must hold SELECT), a missing
# tenant policy, a nullable or unchecked manifest_hash, a kind CHECK that is not MEMORY/EVIDENCE, a missing composite FK to the request,
# and a missing partial UNIQUE index over the open request.
# Fails on: a surviving v1 stream-key column, a missing v2 column, a scope_kind CHECK that is not the five values, a deletion_targets
# table not owner-owned with ENABLE + FORCE RLS, any grantee other than the owner, role_gateway and role_maintenance (PUBLIC
# included) or any privilege other than SELECT on it, a door that is not owner-owned SECURITY DEFINER with
# search_path = pg_catalog, pg_temp, or EXECUTE on the door for anyone but the owner and role_gateway.
postcheck = """
select (select count(*) = 0 from pg_attribute
         where attrelid = to_regclass('control.deletion_requests') and not attisdropped
           and attname in ('domain', 'projection_kind', 'projection_version', 'stream_seq'))
 and (select count(*) = 4 from pg_attribute
       where attrelid = to_regclass('control.deletion_requests') and not attisdropped
         and attname in ('requested_by', 'manifest_hash', 'confirm_token_id', 'logical_deleted_at'))
 and (select count(*) = 1 from pg_constraint
       where conrelid = to_regclass('control.deletion_requests') and conname = 'deletion_requests_scope_kind_check'
         and pg_get_constraintdef(oid) like '%MEMORY%' and pg_get_constraintdef(oid) like '%EVIDENCE_CLOSURE%'
         and pg_get_constraintdef(oid) like '%SUBJECT%' and pg_get_constraintdef(oid) like '%DOCUMENT%'
         and pg_get_constraintdef(oid) like '%TENANT%')
 and (select count(*) = 1 from pg_class c
       where c.oid = to_regclass('control.deletion_targets')
         and pg_get_userbyid(c.relowner) = 'role_migration_owner' and c.relrowsecurity and c.relforcerowsecurity)
 and not exists (select 1 from pg_class c
                  cross join lateral aclexplode(coalesce(c.relacl, acldefault('r', c.relowner))) a
                  where c.oid = to_regclass('control.deletion_targets') and a.grantee <> c.relowner
                    and (a.privilege_type <> 'SELECT' or a.grantee = 0
                         or pg_get_userbyid(a.grantee) not in ('role_gateway', 'role_maintenance')))
 and (select count(*) = 1 from pg_proc p
       where p.oid = to_regprocedure('control.deletion_request_freeze(uuid,text,uuid[])')
         and p.prosecdef and pg_get_userbyid(p.proowner) = 'role_migration_owner'
         and 'search_path=pg_catalog, pg_temp' = any (coalesce(p.proconfig, array[]::text[])))
 and not exists (select 1 from pg_proc p
                  cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
                  where p.oid = to_regprocedure('control.deletion_request_freeze(uuid,text,uuid[])')
                    and a.privilege_type = 'EXECUTE' and a.grantee <> p.proowner
                    and (a.grantee = 0 or pg_get_userbyid(a.grantee) <> 'role_gateway'))
 and has_function_privilege('role_gateway', 'control.deletion_request_freeze(uuid,text,uuid[])', 'EXECUTE')
 and has_table_privilege('role_gateway', 'control.deletion_targets', 'SELECT')
 and has_table_privilege('role_maintenance', 'control.deletion_targets', 'SELECT')
 and not has_table_privilege('role_gateway', 'control.deletion_targets', 'INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
 and not has_table_privilege('role_maintenance', 'control.deletion_targets', 'INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')
 and (select count(*) = 1 from pg_policy
       where polrelid = to_regclass('control.deletion_targets') and polname = 'deletion_targets_tenant_isolation')
 and (select count(*) = 1 from pg_attribute
       where attrelid = to_regclass('control.deletion_requests') and attname = 'manifest_hash' and attnotnull and not attisdropped)
 and (select count(*) = 1 from pg_constraint
       where conrelid = to_regclass('control.deletion_requests') and contype = 'c'
         and pg_get_constraintdef(oid) like '%octet_length(manifest_hash) = 32%')
 and (select count(*) = 1 from pg_constraint
       where conrelid = to_regclass('control.deletion_targets') and contype = 'c'
         and pg_get_constraintdef(oid) like '%MEMORY%' and pg_get_constraintdef(oid) like '%EVIDENCE%')
 and (select count(*) = 1 from pg_constraint
       where conrelid = to_regclass('control.deletion_targets') and contype = 'f'
         and confrelid = to_regclass('control.deletion_requests') and cardinality(conkey) = 2)
 and (select count(*) = 1 from pg_index i
       where i.indexrelid = to_regclass('control.deletion_requests_open_manifest_uq') and i.indisunique
         and pg_get_expr(i.indpred, i.indrelid) like '%REQUESTED%')
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only: the four dropped stream-key columns carried no row (the precheck refuses otherwise), so a rollback is ALTER TABLE control.deletion_requests ADD the four columns back, DROP the v2 columns and constraint, DROP TABLE control.deletion_targets and DROP FUNCTION control.deletion_request_freeze, then restore 0054's UNIQUE over the stream key; nothing else reads the v2 shape before M19-3a."
backup_restore_requirement = "none: both tables are empty when this migration runs (the precheck refuses a database with a v1 row); no existing row is read, copied, rewritten or deleted."
