# §46.1 migration manifest. Card 35b-ii / ADR-0071 D-A: one CONCURRENTLY partial index for the secret-backed exclusion
# set, run outside a transaction (`transaction = "none"`, the 0212 shape). Index-only, safely droppable.

migration_id = "0243_idx_evidence_objects_secret"
class = "REVERSIBLE"
transaction = "none"

precheck = """
select to_regclass('private.evidence_objects_secret_idx') is null as precheck_ok
"""

postcheck = """
select coalesce((select indisvalid and indisready and pg_get_expr(indpred, indrelid) like '%SECRET_MATERIAL%'
                   from pg_index where indexrelid = to_regclass('private.evidence_objects_secret_idx')), false)
       as postcheck_ok
"""

rollback_or_forward_fix = "rollback: DROP INDEX CONCURRENTLY IF EXISTS private.evidence_objects_secret_idx; (also the fix for an INVALID leftover of a failed build, which the precheck refuses by name)"
backup_restore_requirement = "none: index-only DDL built CONCURRENTLY, no row data touched, safely droppable"
