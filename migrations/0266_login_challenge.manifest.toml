# §46.1 migration manifest. Card M02-5: the passwordless login challenge. control.email_challenges gains a closed `purpose`
# column (SIGNUP | LOGIN); control.auth_events.event_type gains LOGIN_CODE_SENT; three owner SECURITY DEFINER doors
# (login_challenge_issue / _claim / _settle, EXECUTE role_gateway only) are the whole write path. No table, no grant on a
# table, no row read, rewritten or deleted (number 0266).

migration_id = "0266_login_challenge"
class = "EXPAND_CONTRACT"

# Refuses unless both tables and the event_type CHECK exist, the column and the doors are not already there.
precheck = """
select to_regclass('control.email_challenges') is not null
   and to_regclass('control.auth_events') is not null
   and exists (select 1 from pg_constraint where conrelid = to_regclass('control.auth_events')
                and conname = 'auth_events_event_type_check')
   and not exists (select 1 from pg_attribute where attrelid = to_regclass('control.email_challenges')
                    and attname = 'purpose' and not attisdropped)
   and to_regprocedure('control.login_challenge_issue(text,text,integer,integer,integer)') is null
   and to_regprocedure('control.login_challenge_claim(text)') is null
   and to_regprocedure('control.login_challenge_settle(uuid,boolean)') is null
 as precheck_ok
"""

# Fails on: a missing purpose column or a purpose CHECK that does not name both values; an event_type CHECK without
# LOGIN_CODE_SENT; a door that is not owner-owned SECURITY DEFINER with search_path=pg_catalog; any EXECUTE on a door for a
# grantee other than the owner and role_gateway (PUBLIC included).
postcheck = """
with doors(sig) as (values
  ('control.login_challenge_issue(text,text,integer,integer,integer)'),
  ('control.login_challenge_claim(text)'),
  ('control.login_challenge_settle(uuid,boolean)'))
select exists (select 1 from pg_attribute where attrelid = to_regclass('control.email_challenges')
                and attname = 'purpose' and not attisdropped and attnotnull)
   and exists (select 1 from pg_constraint where conrelid = to_regclass('control.email_challenges')
                and contype = 'c' and pg_get_constraintdef(oid) like '%SIGNUP%' and pg_get_constraintdef(oid) like '%LOGIN%')
   and exists (select 1 from pg_constraint where conrelid = to_regclass('control.auth_events')
                and conname = 'auth_events_event_type_check' and pg_get_constraintdef(oid) like '%LOGIN_CODE_SENT%')
   and (select count(*) = 3 from doors d join pg_proc p on p.oid = to_regprocedure(d.sig)
         where p.prosecdef and pg_get_userbyid(p.proowner) = 'role_migration_owner'
           and 'search_path=pg_catalog' = any (coalesce(p.proconfig, array[]::text[])))
   and not exists (select 1 from doors d join pg_proc p on p.oid = to_regprocedure(d.sig)
                    cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a
                    where a.privilege_type = 'EXECUTE' and a.grantee <> p.proowner
                      and (a.grantee = 0 or pg_get_userbyid(a.grantee) <> 'role_gateway'))
   and (select count(*) = 3 from doors d where has_function_privilege('role_gateway', to_regprocedure(d.sig), 'EXECUTE'))
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only: dropping the doors is safe once nothing calls them, but a LOGIN row or a LOGIN_CODE_SENT event already written blocks narrowing the purpose or event_type CHECK back; a later migration must first decide those rows."
backup_restore_requirement = "none: one additive defaulted column, a widened CHECK and three functions; no row is read, copied, rewritten or deleted."
