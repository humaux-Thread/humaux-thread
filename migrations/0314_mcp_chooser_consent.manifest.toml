migration_id = "0314_mcp_chooser_consent"
class = "EXPAND_CONTRACT"
precheck = """
SELECT to_regprocedure('control.read_mcp_chooser_decisions(uuid,text,uuid[],uuid[])') IS NOT NULL
   AND to_regprocedure('control.oauth_consent_entitlement_lock(uuid)') IS NOT NULL
   AND to_regclass('control.workspace_memberships') IS NOT NULL AS precheck_ok
"""
postcheck = """
WITH doors AS (
  SELECT * FROM pg_proc WHERE oid IN (
    to_regprocedure('control.oauth_chooser_identity_targets(uuid)'),
    to_regprocedure('control.oauth_chooser_lock_memberships(uuid,uuid,uuid)'),
    to_regprocedure('control.oauth_chooser_session_facts(uuid,uuid,boolean)')
  )
)
SELECT count(*) = 3 AND bool_and(prosecdef AND proacl IS NOT NULL
   AND proowner = 'role_migration_owner'::regrole AND 'search_path=pg_catalog' = ANY(proconfig)
   AND has_function_privilege('role_gateway', oid, 'EXECUTE')
   AND NOT EXISTS (SELECT FROM aclexplode(proacl)
                    WHERE privilege_type = 'EXECUTE' AND grantee NOT IN (proowner, 'role_gateway'::regrole)))
   AS postcheck_ok FROM doors
"""
rollback_or_forward_fix = "Forward fix. Revoke EXECUTE on the chooser read doors if needed. No storage schema is changed."
backup_restore_requirement = "Standard migration backup. Adds read-only, gateway-scoped definers without changing table grants."
