[package]
name = "humaux-local-secret-scan"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "core"

[lints]
workspace = true

[dependencies]
# why: humaux-domain dependency; used-by: [humaux-local-secret-scan, tests]
humaux-domain = { path = "../domain" }
# why: humaux-retrieval dependency; used-by: [humaux-local-secret-scan]
humaux-retrieval = { path = "../retrieval" }
# why: humaux-projection dependency; used-by: [humaux-local-secret-scan]
humaux-projection = { path = "../projection" }
# why: serde_json dependency; used-by: [humaux-local-secret-scan, tests]
serde_json = "1"
# why: sha2 dependency; used-by: [humaux-local-secret-scan]
sha2 = "0.11"
# why: uuid dependency; used-by: [humaux-local-secret-scan]
uuid = { version = "1.25.0", features = ["v7"] }
