[package]
name = "humaux-domain"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# §80.1 fault-injection seam for `egress::PrivateDataPurpose::NonRecipientForTest` — never a
# default feature, so it never ships in a production build. Enabled only via
# `humaux-adapters`'s self-referencing `[dev-dependencies]` entry (its own Cargo.toml doc).
test-support = []

[dependencies]
# why: UUID ids (v7) and parsing; used-by: [domain::affect, domain::audit, domain::authority, domain::context, domain::continuity, domain::egress, domain::identity, domain::ids, domain::lifecycle, domain::selection, domain::subject, tests]
uuid = { version = "1.25.0", features = ["v7"] }
# §8.1 / §48.0①: evidence::payload_sha256 raw-byte SHA-256.
# why: sha256 digests for hashes, fingerprints and scope_hash; used-by: [domain::audit, domain::confirm, domain::context, domain::egress, domain::evidence, domain::note, domain::selection]
sha2 = "0.11"
# §7.3 T4.1: `ExternalCall` is a production (non-test) trait that must be `dyn`-compatible
# (`Arc<dyn ExternalCall>` at the call site) — real dependency, not dev-only. Same macro
# already resolved in the workspace lockfile via `humaux-adapters`'s `email::EmailProvider`
# trait (its own Cargo.toml doc explains the object-safety reason).
# why: object-safe async traits for ports and transports; used-by: [domain::egress, domain::grounding]
async-trait = "0.1"

[dev-dependencies]
# §7.3 T4.1 tests/ui/: proves `EgressPermit` has no construction path outside this crate
# (private fields + non-`pub(crate)` `issue`) — same pattern `humaux-adapters`'s G6-DB1
# fixtures already use for its own §6.2.3 typed-pool topology. Reused unmodified by T4.6/T4.7
# §11.8's `AutoMutableMemoryId` compile-fail fixture (`tests/ui/fail_bound_to_auto_mutable.rs`).
# why: compile-fail UI tests for typestate/authorization guarantees; used-by: [tests]
trybuild = "1"
