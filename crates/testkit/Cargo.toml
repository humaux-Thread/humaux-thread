[package]
name = "humaux-testkit"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "core"

[lints]
workspace = true

[dev-dependencies]
# Advanced Rust Testing / Architecture Tests > Property-based (spec，紧接
# §79.8 Coverage 之后的未编号章节，非 §79.7 Mutation Testing): quota
# reservation invariants, scope normalization, cache keys, ID generation,
# completeness aggregation, public provenance closure.
# dep-map: allow cargo-usedby — no module in this crate imports proptest directly today; kept
#   available for property-based fault/pair test authors per crates/testkit/README.md
# why: proptest dependency; used-by: [tests]
proptest = "1.11.0"
# T0.4 §53.4 / G52-5 注错测试需要真实的 abstain() / DegradeCode / ErrorCode
# —— testkit 本身仍不依赖 domain/telemetry（见 src/lib.rs 顶部说明），这两
# 条只挂在 dev-dependencies，只有 tests/fault、tests/pair 用得到。
# why: humaux-domain dependency; used-by: [testkit::tests::metrics::data_disclosures_finalized_total, testkit::tests::metrics::data_disclosures_reserved_unfinalized, testkit::tests::metrics::jobs_dead, testkit::tests::metrics::jobs_pending, testkit::tests::metrics::jobs_processing, testkit::tests::metrics::jobs_waiting_key, testkit::tests::metrics::oldest_pending_age_seconds, testkit::tests::metrics::processing_gap_count, testkit::tests::metrics::projection_lag_events, testkit::tests::pair::cannot_establish_completeness_degraded, testkit::tests::pair::cannot_establish_completeness_terminal, testkit::tests::pair::projection_lag_degraded, testkit::tests::pair::projection_lag_terminal, tests]
humaux-domain = { version = "0.1.0", path = "../domain" }
# M01 D4 / G-M01-4 (§53.4): the live DegradeCode variants' fault tests drive the production envelope emitters
# (build_projection_block, dense_lane_substitution) instead of calling the single exit point themselves — dev-only,
# testkit's own src stays free of retrieval types.
# why: real-path fault tests call the production envelope functions that emit ProjectionLag, ProjectionInvisibleLoss and LaneSubstituted; used-by: [testkit::tests::fault::lane_substituted, testkit::tests::fault::projection_invisible_loss, testkit::tests::fault::projection_lag]
humaux-retrieval = { version = "0.1.0", path = "../retrieval" }
# why: humaux-telemetry dependency; used-by: [testkit::tests::fault::completeness_unknown, testkit::tests::fault::egress_denied, testkit::tests::fault::embed_provider_timeout, testkit::tests::fault::graph_expand_capped, testkit::tests::fault::lane_substituted, testkit::tests::fault::projection_invisible_loss, testkit::tests::fault::projection_lag, testkit::tests::fault::rerank_model_mismatch, testkit::tests::fault::rerank_provider_timeout, testkit::tests::fault::state_pin_ambiguous, testkit::tests::fault::state_pin_missing, testkit::tests::metrics::data_disclosures_finalized_total, testkit::tests::metrics::data_disclosures_reserved_unfinalized, testkit::tests::metrics::degrade_total, testkit::tests::metrics::jobs_dead, testkit::tests::metrics::jobs_pending, testkit::tests::metrics::jobs_processing, testkit::tests::metrics::jobs_waiting_key, testkit::tests::metrics::oldest_pending_age_seconds, testkit::tests::metrics::processing_gap_count, testkit::tests::metrics::projection_lag_events, testkit::tests::pair::cannot_establish_completeness_degraded, testkit::tests::pair::cannot_establish_completeness_terminal, testkit::tests::pair::projection_lag_degraded, testkit::tests::pair::projection_lag_terminal, tests]
humaux-telemetry = { version = "0.1.0", path = "../telemetry" }
