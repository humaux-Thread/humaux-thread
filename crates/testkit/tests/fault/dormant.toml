# Dormant DegradeCode variants (M01 D4, G-M01-4; Baseline §53.4; ADR-0077).
#
# A variant with a production emit site -- `abstain(DegradeCode::X, ..)` or `.also(DegradeCode::X)` in non-test code
# of crates/*/src or bins/*/src -- must have a fault test that drives that production function and never names
# `abstain` itself. A variant with no such site yet keeps a synthetic fault test (it calls `abstain` directly) and is
# listed here with the card that adds the site. `cargo xtask architecture-check` G-M01-4 is red both ways:
#   - a live variant whose fault test names `abstain`;
#   - a row for a variant that now has a production emit site (the row must be deleted: the ledger only shrinks);
#   - a variant with no production emit site and no row (a new row is a reviewed diff line naming its owner).
# Rows are never added to hide a live variant. Deleting a variant is not an option here: §53.2 / §52.2 freeze the 12.
#
# Row keys: variant (DegradeCode variant, PascalCase), owner (module card, M<nn> or M<nn>-<card>), reason (required).

