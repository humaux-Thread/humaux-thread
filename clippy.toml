# Clippy configuration. The workspace lint levels live in Cargo.toml `[workspace.lints.clippy]` (every member
# inherits them with `[lints] workspace = true`).
#
# §78.4: `too_many_lines` and `excessive_nesting` are the size/complexity signals the spec names;
# `cognitive_complexity` is explicitly rejected there and is not enabled.
#
# excessive_nesting does nothing until this threshold is set — unlike the other lints it has no built-in
# default (clippy's own documentation only shows an example value). 5 is the M01-6 (G-M01-8) measurement
# basis: CI runs 39954828293 and 39957055872 (clippy job, 2026-10-23) reported 6 blocks past it, in three
# test fixtures — `crates/retrieval/tests/planner_predicate_eval.rs::parse_sql_value_list` and the two
# spawned accept loops of `crates/infra-cell/src/transport.rs`. Each carries one
# `#[allow(clippy::excessive_nesting)]` with its `// ponytail:` reason. Raising this value is a reviewed
# one-line diff; the allow count is pinned exactly in xtask/known_red.toml `[[lint_allows]]` and checked by
# `cargo xtask architecture-check`.
excessive-nesting-threshold = 5
