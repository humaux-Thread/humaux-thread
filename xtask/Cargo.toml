[package]
name = "xtask"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "core"

[lints]
workspace = true

[dependencies]
# §46.1 manifest parsing (migration_rehearsal.rs) — no serde derive needed, toml::Value suffices.
# why: parse migration manifests and dep-map header lists; used-by: [xtask::architecture_check, xtask::dep_map, xtask::known_red, xtask::r4_fault_manifest]
toml = "1"
# §50.1 config-check.rs: reuses contracts::feature_registry parsing, no second parser.
# why: reuse the typed features.toml parser instead of a second one; used-by: [xtask::config_check, xtask::mechanism_registry]
humaux-contracts = { path = "../crates/contracts" }
# why: reuse the real Postgres/Qdrant repo adapters instead of re-typing SQL/wire calls; used-by: [tests, xtask::e2e_onboard, xtask::e2e_seed, xtask::mechanism_registry]
humaux-adapters = { path = "../crates/adapters" }
# why: async runtime for the ops subcommands that call async adapters; used-by: [tests, xtask::e2e_seed, xtask::mechanism_registry, xtask::soak]
tokio = { version = "1", features = ["rt-multi-thread"] }
# Parsing `cargo metadata` output for dependency-rule checks (§78.3) and gate reports.
# why: parse cargo metadata / gate report JSON; used-by: [tests, xtask::architecture_check, xtask::e2e_onboard, xtask::soak]
serde_json = "1"
# Phase 1: migration runner (migrate.rs) + live-DB enumerations (rls_check.rs, §48.2).
# why: direct Postgres client for migrations, rehearsal and RLS/grant enumeration; used-by: [tests, xtask::dep_map, xtask::e2e_onboard, xtask::e2e_seed, xtask::load, xtask::migration_rehearsal, xtask::serial_lane, xtask::soak]
postgres = { version = "0.19", features = ["with-uuid-1"] }
# e2e-seed.rs: same Uuid type postgres::Client's with-uuid-1 feature binds against.
# why: id type shared with postgres's with-uuid-1 binding; used-by: [tests, xtask::e2e_onboard, xtask::e2e_seed, xtask::soak]
uuid = { version = "1.25.0", features = ["v4"] }
# T5.8 card_version.rs: calls the real `projection::card::{assemble, CARD_TEMPLATE_HASH,
# template_fingerprint}` instead of re-deriving/hardcoding a second copy of the template shape
# — reuse, not a second implementation to keep in sync by hand.
# why: reuse the real RetrievalCard builder/template-hash instead of a second copy; used-by: [xtask::card_version, xtask::soak]
humaux-projection = { path = "../crates/projection" }
# e2e-seed.rs: reuses the real keyed-hash function instead of re-deriving it (§73.5, binding rule).
# why: reuse compute_api_key_hash instead of re-deriving the keyed hash; used-by: [xtask::e2e_seed]
humaux-protocol = { path = "../crates/protocol" }
# e2e-seed.rs: TenantId/UserId/WorkspaceId newtypes for quota_repo::issue_window's signature.
# why: typed ids shared with adapters::quota_repo::issue_window's signature; used-by: [xtask::architecture_check, xtask::e2e_onboard, xtask::e2e_seed, xtask::soak]
humaux-domain = { path = "../crates/domain" }
# e2e-seed.rs: 32-char alphanumeric secret generation (getrandom-backed, workspace's existing line).
# why: getrandom-backed secret generation for seeded API keys; used-by: [xtask::e2e_seed]
rand = "0.9"

# ADR-0066 D-Q (E-4): migrate / rls-check / projection-serve / member moved into humaux-maintenance; xtask keeps
# its subcommand names as thin delegations, soak reads switch_visible, dep_map reads the rls role sets.
# why: the moved ops and their shared consts; used-by: [xtask::dep_map, xtask::member, xtask::migrate, xtask::migration_rehearsal, xtask::projection_serve, xtask::rls_check, xtask::soak]
humaux-maintenance = { path = "../bins/maintenance" }

# Card 28: the seed's entitlement period (now .. now + 1 h) for provisioning::onboard_tenant.
# why: entitlement period timestamps for the onboarding library; used-by: [xtask::e2e_seed]
time = "0.3"
# ADR-0050 D-D: the throwaway-DB migrate tests skip through `skip_or_fail(ExternalDep::Postgres)`
# so `HUMAUX_REQUIRE_DB=1` turns a missing database into a red instead of a silent pass; ADR-0063
# "Dev integrity finding": `e2e-seed --teardown` runs the one fixture purge (a normal dependency now).
# testkit has zero normal dependencies, so this adds no cycle and nothing reaches a runtime binary.
# why: skip_or_fail(ExternalDep::Postgres) and the shared fixture purge; used-by: [tests, xtask::dep_map, xtask::e2e_seed, xtask::migration_rehearsal, xtask::serial_lane]
humaux-testkit = { path = "../crates/testkit" }
# why: the loadgen image runs this binary and deploy-check --release reads its `--version` line (ADR-0066 D-D / D-S); used-by: [xtask::main]
humaux-telemetry = { path = "../crates/telemetry" }

[dev-dependencies]
# why: the throwaway-database guard (test-support feature) the lane and seed tests share with the moved migrate tests; used-by: [tests]
humaux-maintenance = { path = "../bins/maintenance", features = ["test-support"] }
