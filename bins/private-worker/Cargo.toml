[package]
name = "humaux-private-worker"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "core"

[lints]
workspace = true

[dependencies]
# T4.4/T4.5 §11/§11.1: this binary is the one process allowed to hold both `PrivateWorkerDbPool`
# (role_private_worker, §6.2.1 R+W on `private.*`) and BYOK decrypt capability
# (`humaux_adapters::byok`/`openbao`, §11.1 "仅 humaux-private-worker 在最贴近 adapter 处解密")
# — unlike `humaux-consolidation-worker`, which deliberately has no path to either (see that
# binary's own Cargo.toml comment). This skeleton only wires the DB pool; the BYOK provider
# client and its OpenBao/transport backends are pending wiring (openbao.rs / infra-egress's
# richer transport are still stubs, see `crates/adapters/src/byok.rs`'s module doc).
# why: humaux-adapters dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::inference_rpc, private-worker::main, private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
humaux-adapters = { path = "../../crates/adapters" }
# why: humaux-application dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::inference_rpc, private-worker::tests::contribution_execution_runner, private-worker::tests::start_manual_contribution_command_0131, tests]
humaux-application = { path = "../../crates/application" }
# why: humaux-domain dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::main, private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, tests]
humaux-domain = { path = "../../crates/domain" }
# why: humaux-infra-cell dependency; used-by: [private-worker::tests::distill_hop_e2e, tests]
humaux-infra-cell = { path = "../../crates/infra-cell" }
# ADR-0016 `distill.rs`: `humaux_projection::fingerprint::source_hash` is the workspace's sole
# `SourceHash` constructor (§48.0/G80-11) — the Distill hop's `private.processing_runs.
# source_hash` must come from it, never a second hasher.
# why: humaux-projection dependency; used-by: [private-worker::distill, private-worker::tests::distill_hop_e2e, tests]
humaux-projection = { path = "../../crates/projection" }
# ADR-0061 D-B: the loopback ops listener (no metrics crate, D-A).
# why: /metrics + /status exposition; used-by: [private-worker::main]
humaux-telemetry = { path = "../../crates/telemetry" }
# §11.8 `inference_rpc.rs`: `axum::serve` over a `tokio::net::UnixListener` (axum 0.8 native
# `Listener` impl) — same pin `bins/retrieval-worker`'s own ADR-0012 RPC transport already uses.
# why: axum dependency; used-by: [private-worker::inference_rpc]
axum = "0.8.9"
# why: serde dependency; used-by: [private-worker::inference_rpc]
serde = { version = "1", features = ["derive"] }
# why: serde_json dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, tests]
serde_json = "1"
# why: sha2 dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::tests::contribution_execution_runner, private-worker::tests::distill_hop_e2e, tests]
sha2 = "0.11"
# why: hex dependency; used-by: [private-worker::distill, private-worker::inference_rpc, private-worker::tests::distill_hop_e2e, tests]
hex = "0.4"
# why: tokio dependency; used-by: [private-worker::inference_rpc, private-worker::main, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
# why: uuid dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::inference_rpc, private-worker::main, private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
uuid = { version = "1.25.0", features = ["serde", "v7"] }

[dev-dependencies]
# why: async-trait dependency; used-by: [private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, tests]
async-trait = "0.1"
# why: postgres dependency; used-by: [private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
postgres = { version = "0.19", features = ["with-uuid-1", "with-serde_json-1"] }
# why: uuid dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::inference_rpc, private-worker::main, private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
uuid = { version = "1.25.0", features = ["v4"] }
# `tests/distill_hop_e2e.rs` (ADR-0016): live MiniMax + live DB, visible SKIP / `HUMAUX_REQUIRE_*`
# panic via the shared testkit; the projection leg drives the real
# `humaux_adapters::projection_worker::run_once` with the real gitleaks-backed scanner.
# why: humaux-testkit dependency; used-by: [private-worker::tests::contribution_execution_runner, private-worker::tests::derived_dispatch_e2e, private-worker::tests::distill_hop_e2e, private-worker::tests::start_manual_contribution_command_0131, tests]
humaux-testkit = { path = "../../crates/testkit" }
# why: humaux-local-secret-scan dependency; used-by: [private-worker::tests::distill_hop_e2e, tests]
humaux-local-secret-scan = { path = "../../crates/local-secret-scan" }
# why: sha2 dependency; used-by: [humaux-private-worker, private-worker::distill, private-worker::tests::contribution_execution_runner, private-worker::tests::distill_hop_e2e, tests]
sha2 = "0.11"
# The `ReasoningAdmissionLocator.admitted_at` type (sqlx's `time` re-export) for the route_providers unit tests.
# why: time dependency; used-by: [private-worker::route_providers]
time = "0.3"
