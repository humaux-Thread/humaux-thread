[package]
name = "humaux-retrieval-worker"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "core"

[lints]
workspace = true

[dependencies]
# why: typed PG pools, repositories and wire adapters this package drives; used-by: [retrieval-worker::main, retrieval-worker::rpc]
humaux-adapters = { path = "../../crates/adapters" }
# why: domain ids, errors and value types shared across layers; used-by: [retrieval-worker::main, retrieval-worker::rpc, tests]
humaux-domain = { path = "../../crates/domain" }
# why: same-Cell transport and CellAccessPermit for Qdrant/UDS calls; used-by: [retrieval-worker::main]
humaux-infra-cell = { path = "../../crates/infra-cell" }
# T7.1 `EmbeddingProvider`/`embedding_provider_for`/`EmbeddingModelDescriptor` — this
# binary is the one legal place to name both `humaux-adapters` and `humaux-retrieval-provider`
# together (no cycle: neither depends on this crate) — see
# `crates/adapters/src/projection_worker.rs`'s `CardEmbedder` doc for why `humaux-adapters`
# itself cannot.
# why: embedding provider router/adapters; used-by: [retrieval-worker::main, retrieval-worker::rpc]
humaux-retrieval-provider = { path = "../../crates/retrieval-provider" }
# ADR-0061 D-B: the loopback ops listener and the §41.2 text encoder (no metrics crate, D-A).
# why: /metrics + /status exposition; used-by: [retrieval-worker::main]
humaux-telemetry = { path = "../../crates/telemetry" }
# why: pinned local secret scanner that seals egress payloads; used-by: [retrieval-worker::main, retrieval-worker::rpc]
humaux-local-secret-scan = { path = "../../crates/local-secret-scan" }
# Same pin as crates/retrieval-provider and crates/telemetry — no [workspace.dependencies]
# refactor (query_embed_rpc card §6 resolution).
# why: structured logs/spans; used-by: [retrieval-worker::rpc]
tracing = "0.1.44"
# ADR-0012 `rpc.rs`: `humaux_retrieval::request::{RetrievalIntent, build_request,
# resolve_registered_retrieval_profile}` — sealing the RPC's raw query text needs the same
# sole request constructor every other caller uses (§55.1), not a worker-local shortcut.
# why: retrieval request/envelope/planner (sole request constructor, §55.1); used-by: [retrieval-worker::rpc]
humaux-retrieval = { path = "../../crates/retrieval" }
# ADR-0084 D-E: the rerank registry entries (`rerank_enabled`, `rerank_threads`), `RERANK_MAX_LEN_MAX` and
# `RETRIEVAL_CANDIDATE_CAP` are read from the one registry, never re-declared here.
# why: rerank registry entries and the wire bounds derived from them; used-by: [retrieval-worker::rerank, retrieval-worker::rpc]
humaux-contracts = { path = "../../crates/contracts" }
# why: object-safe async traits for ports and transports; used-by: [retrieval-worker::main]
async-trait = "0.1"
# ADR-0012: `axum::serve` over a `tokio::net::UnixListener` (axum 0.8 native `Listener` impl)
# is this binary's RPC transport — same pin sibling bins already use.
# why: HTTP/UDS server framework; used-by: [retrieval-worker::main, retrieval-worker::rpc]
axum = "0.8.9"
# why: derive (de)serialization for wire/DTO types; used-by: [retrieval-worker::rpc]
serde = { version = "1", features = ["derive"] }
# why: JSON payloads and envelopes; used-by: [tests]
serde_json = "1"
# Matches `crates/adapters`/`crates/local-secret-scan`'s existing sha2 0.11 pin — no second
# independent version in the dependency graph.
# why: sha256 digests for hashes, fingerprints and scope_hash; used-by: [retrieval-worker::rpc]
sha2 = "0.11"
# why: async runtime; used-by: [retrieval-worker::main, retrieval-worker::rpc]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
# ADR-0084 D-B: the rerank lane's ONNX Runtime binding, retrieval-worker only. Exact pin: the newest release is a
# release candidate whose notes report over 30 fixed undefined-behaviour bugs, so a bump is a reviewed change. No
# `download-binaries`: the shared library is the pinned tarball the image ships, loaded by path (`load-dynamic`);
# `api-30` because that library is ONNX Runtime 1.30.0.
# why: ONNX Runtime session that scores the rerank pairs; used-by: [retrieval-worker::rerank]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tracing", "api-30"] }
# ADR-0084 D-B / V8: `fancy-regex` (pure Rust) instead of the default `onig`, and none of the training-only defaults, so
# loading `tokenizer.json` needs no C or C++ build.
# why: Hugging Face tokenizer that encodes the (query, document) pairs; used-by: [retrieval-worker::rerank]
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
# why: UUID ids (v7) and parsing; used-by: [retrieval-worker::main, retrieval-worker::rpc, tests]
uuid = { version = "1.25.0", features = ["v7", "serde"] }

[dev-dependencies]
# why: the §79.2 three-state skip contract (skip_or_fail); used-by: [tests]
humaux-testkit = { path = "../../crates/testkit" }
# why: owner-DSN fixtures on the throwaway database (create, revoke, terminate, drop); used-by: [tests]
postgres = { version = "0.19", features = ["with-uuid-1", "with-serde_json-1"] }
