[package]
name = "humaux-public-worker"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
# ADR-0073 D-A: the public knowledge pool is cloud-only; cloud may depend on core, never the reverse.
edition = "cloud"

[lints]
workspace = true

[dependencies]
# why: typed PG pools, repositories and wire adapters this package drives; used-by: [public-worker::main]
humaux-adapters = { path = "../../crates/adapters" }
# why: domain ids, errors and value types shared across layers; used-by: [public-worker::main]
humaux-domain = { path = "../../crates/domain" }
# why: same-Cell transport and CellAccessPermit for Qdrant/UDS calls; used-by: [public-worker::main]
humaux-infra-cell = { path = "../../crates/infra-cell" }
# why: public admission, revocation and projection runners this binary drives; used-by: [public-worker::main]
humaux-public-pool = { path = "../../crates/public-pool" }
# why: async runtime; used-by: [public-worker::main]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
# why: UUID ids (v7) and parsing; used-by: [public-worker::main]
uuid = { version = "1.25.0", features = ["v7"] }
