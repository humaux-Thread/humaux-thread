[package]
name = "humaux-billing-worker"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[package.metadata.humaux]
edition = "cloud"

[lints]
workspace = true

[dependencies]
# why: existing billing vocabularies and closed error codes (§52, §78.2); used-by: [billing-worker::normalize, billing-worker::signature, tests]
humaux-domain = { path = "../../crates/domain" }
# why: webhook envelope parsing (§71.3); used-by: [billing-worker::normalize, tests]
serde_json = "1"
# why: constant-time webhook MAC verification (§71.3); used-by: [billing-worker::signature]
hmac = "0.13"
# why: provider SHA256 MAC algorithm (§71.3); used-by: [billing-worker::signature]
sha2 = "0.11"
# why: provider signature hex decoding (§71.3); used-by: [billing-worker::signature]
hex = "0.4"

[dev-dependencies]
# why: runtime-only random HMAC test keys (§79.4); used-by: [tests::signature]
uuid = { version = "1.25.0", features = ["v4"] }
