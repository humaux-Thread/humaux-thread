# Schedule register (C-M21-3) — one entry per row of the frozen Baseline §65 table.
#
# Baseline §65 "自动化 Repair Jobs" is the authority for what exists (module design note M21 D2, :120-121):
# a repair job exists only if the §65 table lists it. This file maps each §65 job to an existing `Task`
# variant of bins/maintenance/src/serve.rs, or records why no resident task exists and which card owns it.
# `cargo xtask schedule-register` checks it (G-M21-1): every §65 row has an entry; every `task` names a
# `Task` variant; no entry names a job §65 does not list; each entry has exactly one of the two targets.

