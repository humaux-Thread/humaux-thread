# Backup catalog (C-M23-0): every table of docs/architecture/db_objects.md is classified for the knowledge export.
#
# Authority: module design note M23 D1 (:74-88) and C-M23-0 (:50); ADR-0121 D-A, including its lead ruling on
# issue #332 (the KNOWLEDGE set is closed under foreign keys).
# Rule (maintenance note :244-247, G-M23-3): a new table lands with its row in the same PR; the knowledge scope changes
# by a row here, in the table's own PR. `cargo xtask architecture-check` fails G-M23-3 naming any table without a row
# and any row without a table, and G-M23-3b naming (child, parent[, column]) for any NOT NULL foreign key out of a
# KNOWLEDGE row into a non-KNOWLEDGE one and for any uncovered or stray `set_null`.
#
# One `["schema.table"]` row per `kind: table` / `kind: partitioned` section of db_objects.md (partition leaves are never
# rows: D2 dumps a parent with --table-and-children), grouped by schema, sorted.
#   class    "KNOWLEDGE" | "EXCLUDED"
#   owner    M01..M29: the module whose design note lists the table as owned data
#   basis    "<owner source>; <class source>"
#              owner source: Mxx:N = module_design_Mxx.md line N; map:N = module_map_v3.md line N (the modules with no
#              design note, M05 and M11); created-in <migration> = no note names the table
#              class source: D1 = named by D1 (tables or wildcard); D1 principle = unnamed in D1, classified by its
#              principle; ADR-0121 D-A / #332 = the closure ruling moves it; FK closure: ... = promoted or demoted by it
#   reason   required for EXCLUDED, absent for KNOWLEDGE
#   set_null KNOWLEDGE rows only: the column(s) of a nullable foreign key into a non-KNOWLEDGE table; the restore sets
#              them to NULL in one step shared by M23-4 and M23-5 (ADR-0121 "Amended (M23-2)")

