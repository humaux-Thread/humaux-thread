# docs/architecture/modules.toml — 机器可读的模块目录（限界上下文契约）。
#
# 职责：把 ADR-0130 的 19 个限界上下文、类型、历史 M 号、唯一写主的表与允许的依赖方向写成一份
#   机器可读清单。判据正文只在 docs/adr/0130-bounded-context-modules-ddd-hexagonal.md 与
#   Baseline_2.9.md；本文件是清单，不是第二份规范。
# 谁读它：后续「边界闸」卡（architecture-check 的 HEX-CONTEXT / HEX-WRITER / HEX-COVERAGE 臂）；
#   xtask 与 CI 只读不写。
# 不变量（ADR-0130 D4/D5/D6）：
#   1. 表唯一写主：owned_tables 的并集无重复，一张表恰在一个模块里出现。
#   2. 依赖无环：may_depend_on 组成的目标应用依赖图必须无环；它不宣称当前源码已经无环。
#   3. 历史 M 号全覆盖：M01..M29 在 legacy_m 里各恰出现一次，任务卡 ID 永不重编号。
#   2a. 同事务协作不是应用依赖：in_txn_door 列出 PG adapter 内的具名窄门（可双向），不计入无环判定（ADR-0130 D7a）。
#   4. 派生而非手写：由 19 模块目录与表写权派生；改清单先改源头再重生成，手改表行等于
#      制造第二份写主真相。
#
# 状态：Accepted 2026-11-15（ADR-0130）。private.run_acceptances 是
#   ACCEPTED_DESIGN_NOT_ASSERTED_DEPLOYED（ADR-0106 D-D），DDL 落地前不进 owned_tables。

