# ADR-0130 D7a: same-transaction collaboration inside the PG adapter. Bidirectional by design;
# excluded from the may_depend_on acyclicity check and never a licence for an application-layer edge.
[[in_txn_door]]
modules = ["knowledge_lifecycle", "coordination"]
use_case = "remember"
note = "M07 fact door and M18 verification collaborate in one PG transaction"
