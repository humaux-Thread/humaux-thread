# G-M24-3 SAST ledger (§80 "SAST", M24-3): every CodeQL Rust finding in non-test code at security severity
# high/critical (or level error) that is accepted today, keyed by (rule, path) with an exact count. The sast job in
# ci.yml is red when a (rule, path) pair is missing here, when its count rises (a new finding) or falls (the row must
# shrink — §80.1.1 shrink-only), or when a row has no owner/reason. verdict: T = inside #[cfg(test)], FP = false
# positive (reason says why), REAL = a genuine finding parked with its owning module card (none today).
# Baseline: CodeQL bundle 2.27.2, commit f51b618, triaged by reading each sink back to its source (2026-10-15).
# ponytail: counted per (rule, path), so in a file that already has T rows a test finding removed and a product
# finding added in one PR cancel out; upgrade = key rows by SARIF partialFingerprints once line churn is measured.

[[finding]]
rule = "rust/cleartext-logging"
path = "bins/gateway/src/recall.rs"
count = 2
verdict = "FP"
owner = "M11"
reason = "eprintln prints request_id UUID, numeric dimensions and a closed worker failure code (ErrorCode::as_str or fixed tags); never query text or vector elements."

