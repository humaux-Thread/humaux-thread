name: rerank parity (G-RET-11, G-RET-14)
# ADR-0084 D-G (T-RET-7c): G-RET-11 score parity and G-RET-14 artifact pin on the pinned rerank files, run INSIDE the
# runtime base image (U3): the test binaries, the ONNX Runtime library and the artifacts are mounted read-only into
# gcr.io/distroless/cc-debian13 at the Dockerfile's digest, so a library the base does not resolve fails here, not on
# a node. No services (the tests need no database).
#
# One definition (T-CI-4): ci.yml's required `rerank-parity` job and targeted.yml's `rerank_parity` dispatch both call
# this action, so a mutation on this path is red-proven without ci.yml (whose `live` job spends provider money). The
# caller checks out the ref and supplies the runner; this action needs the workspace at that ref and no services.
# The pins below repeat deploy/images/humaux/Dockerfile's `ADD --checksum` lines and docs/ops/runbook.md section 12:
# change all three together.
description: G-RET-11 score parity and G-RET-14 artifact pin inside the pinned distroless runtime image
inputs:
  ort_url:
    description: ONNX Runtime aarch64 tarball (pinned)
    required: false
    default: https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-aarch64-1.30.0.tgz
  ort_sha256:
    description: sha256 of the ONNX Runtime tarball
    required: false
    default: e16a27a8ed330bbc698df7330b0cf56e722f354e3bcc92118682c74ef3c3e3da
  rerank_url:
    description: rerank artifact tarball (pinned)
    required: false
    default: https://github.com/humaux/humaux-thread/releases/download/rerank-mmarco-int8-v1/rerank-mmarco-int8-v1.tar.gz
  rerank_sha256:
    description: sha256 of the rerank artifact tarball
    required: false
    default: cd90976aa97eee7a29221a1bd136e3b44545e1df1dec2008b613b67711b82c2f
  runtime_image:
    description: gcr.io/distroless/cc-debian13:nonroot, the `runtime` stage of deploy/images/humaux/Dockerfile (resolved 2026-10-07)
    required: false
    default: gcr.io/distroless/cc-debian13:nonroot@sha256:e792ab3d241a468a4fd7519ddbbebe66b49b5f365771716ea688ad40b6c6f1c2
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install 1.99.0 --profile minimal -c clippy -c rustfmt
        rustup default 1.99.0
        rustc --version | grep -F 'rustc 1.99.0'
        if [ "$(uname -m)" = aarch64 ] && ! command -v ld.lld >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ". -> target"

    # The two tarballs are cached by their sha256 (a changed pin is a new key); the checksum is verified on every run,
    # a cache hit included, so a poisoned cache cannot pass.
    - uses: actions/cache@v4
      with:
        path: ~/rerank-downloads
        key: rerank-artifacts-${{ inputs.ort_sha256 }}-${{ inputs.rerank_sha256 }}

    - name: fetch and verify the ONNX Runtime library and the rerank artifact
      shell: bash
      env:
        ORT_URL: ${{ inputs.ort_url }}
        ORT_SHA256: ${{ inputs.ort_sha256 }}
        RERANK_URL: ${{ inputs.rerank_url }}
        RERANK_SHA256: ${{ inputs.rerank_sha256 }}
      run: |
        set -euo pipefail
        dl="$HOME/rerank-downloads"
        mkdir -p "$dl"
        fetch() { # url sha256 file
          [ -f "$dl/$3" ] || curl --fail --location --silent --show-error "$1" -o "$dl/$3"
          printf '%s  %s\n' "$2" "$dl/$3" | sha256sum --check --strict
        }
        fetch "$ORT_URL" "$ORT_SHA256" ort.tgz
        fetch "$RERANK_URL" "$RERANK_SHA256" rerank.tar.gz
        art="$RUNNER_TEMP/rerank-artifacts"
        mkdir -p "$art"
        tar -xzf "$dl/ort.tgz" -C "$art"
        tar -xzf "$dl/rerank.tar.gz" -C "$art"
        lib="$(find "$art" -name 'libonnxruntime.so.1.30.0' -type f | head -n1)"
        model="$(find "$art" -name 'model_quantized.onnx' -type f | head -n1)"
        tok="$(find "$art" -name 'tokenizer.json' -type f | head -n1)"
        test -n "$lib" && test -n "$model" && test -n "$tok"
        sha256sum "$lib" "$model" "$tok"
        {
          echo "HUMAUX_RETRIEVAL_WORKER_ONNXRUNTIME_PATH=$lib"
          echo "HUMAUX_RETRIEVAL_WORKER_RERANK_MODEL_PATH=$model"
          echo "HUMAUX_RETRIEVAL_WORKER_RERANK_TOKENIZER_PATH=$tok"
          echo "ARTIFACT_DIR=$art"
        } >> "$GITHUB_ENV"

    - name: build the test binaries
      shell: bash
      run: |
        set -euo pipefail
        cargo test -p humaux-retrieval-worker --test rerank_parity --test rerank_pin --no-run --message-format=json > "$RUNNER_TEMP/build.json"
        jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | "\(.target.name) \(.executable)"' "$RUNNER_TEMP/build.json" | tee "$RUNNER_TEMP/test-binaries.txt"
        grep -q '^rerank_parity ' "$RUNNER_TEMP/test-binaries.txt"
        grep -q '^rerank_pin ' "$RUNNER_TEMP/test-binaries.txt"

    - name: pull the runtime base image
      shell: bash
      env:
        RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      run: docker pull "$RUNTIME_IMAGE"

    # Entrypoint = the test binary. The workspace is mounted at its own path, read-only: the binaries bake in absolute
    # paths (CARGO_BIN_EXE_*) and rerank_pin spawns the worker binary from there. HUMAUX_REQUIRE_RERANK_MODEL=1 turns a
    # missing artifact into a failure, never a SKIP (§79.2).
    - name: G-RET-11 and G-RET-14 inside the runtime image
      shell: bash
      env:
        RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      run: |
        set -uo pipefail
        run_in_image() { # test-name binary args...
          local bin; bin="$(awk -v n="$1" '$1 == n {print $2}' "$RUNNER_TEMP/test-binaries.txt")"
          shift
          docker run --rm --read-only --tmpfs /tmp:rw --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD:ro" -v "$ARTIFACT_DIR:$ARTIFACT_DIR:ro" -w "$PWD" \
            -e HUMAUX_REQUIRE_RERANK_MODEL=1 \
            -e HUMAUX_RETRIEVAL_WORKER_ONNXRUNTIME_PATH -e HUMAUX_RETRIEVAL_WORKER_RERANK_MODEL_PATH \
            -e HUMAUX_RETRIEVAL_WORKER_RERANK_TOKENIZER_PATH \
            --entrypoint "$bin" "$RUNTIME_IMAGE" "$@"
        }
        # Both run even when the first is red, so a fault injected into one gate shows in the log next to the other
        # gate's verdict.
        rc=0
        run_in_image rerank_pin --nocapture || rc=1
        run_in_image rerank_parity --nocapture || rc=1
        exit "$rc"

    # U2 (N2 runner) and U4: one depth-25 call at max_len 256, 20 timed calls after 2 warm-ups, p50 / p95, and VmRSS.
    - name: U2 / U4 latency and memory inside the runtime image
      if: ${{ !cancelled() }}
      shell: bash
      env:
        RUNTIME_IMAGE: ${{ inputs.runtime_image }}
      run: |
        set -euo pipefail
        bin="$(awk '$1 == "rerank_parity" {print $2}' "$RUNNER_TEMP/test-binaries.txt")"
        docker run --rm --read-only --tmpfs /tmp:rw --user "$(id -u):$(id -g)" \
          -v "$PWD:$PWD:ro" -v "$ARTIFACT_DIR:$ARTIFACT_DIR:ro" -w "$PWD" \
          -e HUMAUX_REQUIRE_RERANK_MODEL=1 \
          -e HUMAUX_RETRIEVAL_WORKER_ONNXRUNTIME_PATH -e HUMAUX_RETRIEVAL_WORKER_RERANK_MODEL_PATH \
          -e HUMAUX_RETRIEVAL_WORKER_RERANK_TOKENIZER_PATH \
          --entrypoint "$bin" "$RUNTIME_IMAGE" --ignored --nocapture rerank_latency
