name: targeted
# One cargo test selector on any ref, with the same throwaway postgres + qdrant, env and setup as ci.yml's test jobs.
# Owner ruling 2026-10-13: nothing runs locally — fault-injection red records are produced here: push the mutation to a
# throwaway branch named outside `ci/**` (no full CI), dispatch this workflow with `ref` and `cargo_args`, and cite the
# run id; then dispatch it again on the unmutated ref for the green. Also usable to re-run one flaky test on a branch.
# Exit 3 = no test matched (also what `--no-run` / `-- --list` give, by design); exit 2 = bad input or a ref older than
# the setup action.
#   gh workflow run targeted.yml -f ref=red/40a-g07 -f cargo_args="-p humaux-adapters --test note_put g07"
# regen_docs=true runs no tests: it renders `cargo xtask dep-map --write` and uploads the patch as artifact dep-map-regen,
# so a card fixes dep-map drift before its first full CI round (T-CI-2). Dispatch with the card branch as the workflow ref
# (`--ref`): the definition comes from that ref.
#   gh workflow run targeted.yml --ref <branch> -f ref=<branch> -f regen_docs=true -f cargo_args=""
#   then `gh run download <id> -n dep-map-regen` and `git apply dep-map-regen.patch`.
# rerank_parity=true runs the G-RET-11/G-RET-14 parity job from .github/actions/rerank-parity (no live provider, no
# database), so a mutation on that path gets a red record without ci.yml:
#   gh workflow run targeted.yml --ref <branch-with-this-workflow> -f ref=<red branch> -f rerank_parity=true -f cargo_args=""
# cargo_args reaches the shell only through an env var, split on spaces, never evaluated (no `${{ }}` in `run:`).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or sha to test
        required: true
      cargo_args:
        description: arguments after `cargo test` (e.g. "-p humaux-adapters --test note_put g07 -- --exact"); may be empty when regen_docs or rerank_parity
        required: false
        default: ""
      regen_docs:
        description: run no tests; render the dep-map patch and upload it as artifact dep-map-regen
        type: boolean
        default: false
      rerank_parity:
        description: run the rerank parity job (G-RET-11, G-RET-14) from .github/actions/rerank-parity; cargo_args may then be empty
        type: boolean
        default: false
      as_root:
        description: run under sudo with umask 000 and the loop-mounted scratch (humaux-maintenance's needs)
        type: boolean
        default: false

# The job runs code from an arbitrary ref: the token stays read-only and is not persisted in the checkout.
permissions:
  contents: read

concurrency:
  group: targeted-${{ github.event.inputs.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Same linker as ci.yml (M24), so a targeted run links exactly like CI.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  targeted:
    name: targeted cargo test
    # rerank_parity=true with no cargo selector is the rerank dispatch: skip this job rather than fail its empty-
    # cargo_args guard. A rerank_parity=false dispatch with an empty selector still runs and exits 2 (bad input).
    if: ${{ inputs.regen_docs || inputs.cargo_args != '' || !inputs.rerank_parity }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          # testkit::fixture_purge refuses any database whose name does not start with
          # `humaux_thread_` (the local-disposable predicate the e2e-seed binding rule uses).
          # On `postgres` every fixture tenant stayed behind and the I-SLOT probe of
          # distill_dispatch_v2 grew red with each test (run 37613916837).
          POSTGRES_DB: humaux_thread_ci
        ports:
          - 5432:5432
        # 没有 health check 的话，migrate 会在库还没起来时抢跑，红得莫名其妙。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    env:
      # ADR-0059 D-A: `migrate` refuses to create a 0011 role with the repository
      # placeholder password, so a fresh cluster is provisioned the way production is
      # (runbook §2) in the step below. The migrate principal is the service superuser:
      # outside the §6.2.0 role set, which is what MigratorDbPool::connect requires.
      HUMAUX_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_MIGRATOR_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      # 声明「本次运行有这两个依赖」⇒ 此后任何跳过都是环境故障（见头部注释）。
      HUMAUX_REQUIRE_DB: "1"
      HUMAUX_REQUIRE_QDRANT: "1"
      # The runner has Docker, so the card-37 scratch-source tests must run, never skip (§79.2).
      HUMAUX_REQUIRE_DOCKER: "1"
      # REST port of the qdrant service above (tests default to 6333; stated here so
      # the service block and the tests cannot drift apart silently).
      HUMAUX_TEST_QDRANT_PORT: "6333"
      # §57.1: the postgres service above is a per-run throwaway cluster, so cluster-wide role lifts (BYPASSRLS) are allowed.
      HUMAUX_TEST_DISPOSABLE_CLUSTER: "1"

    steps:
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The setup action comes from the checked-out ref (5f77fa7 introduced it). Older refs are not supported: say so
      # plainly instead of failing inside a missing action (PR #6 Codex P2). Red-record refs are always recent branches.
      - name: the ref carries the setup action
        shell: bash
        run: |
          test -f .github/actions/setup/action.yml || {
            echo "ref $(git rev-parse HEAD) predates .github/actions/setup (5f77fa7): not supported by this workflow"
            exit 2
          }

      # M24: the flag above comes from this (main's) workflow file, but a ref cut before the lld card has a setup
      # action that does not install lld — install it here so such a ref links instead of failing every link.
      - name: lld for the M24 linker flag (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = aarch64 ] && ! command -v ld.lld >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lld
          fi

      # A targeted run restores the shared rust-cache but never saves it: only ci.yml writes the cache (#194).
      - uses: ./.github/actions/setup
        with:
          save_cache: false

      # Twin of ci.yml's "cargo xtask dep-map --check" step (same staging and diff lines): keep the two in step.
      - name: regen docs (cargo xtask dep-map --write)
        if: ${{ inputs.regen_docs }}
        shell: bash
        run: |
          cargo xtask dep-map --write
          git add -A -- docs/architecture deploy/env
          git diff --cached --binary -- docs/architecture deploy/env > "$RUNNER_TEMP/dep-map-regen.patch" || true
          git diff --cached --stat -- docs/architecture deploy/env
          if [ -s "$RUNNER_TEMP/dep-map-regen.patch" ]; then echo "REGEN: patch written"; else echo "REGEN: no drift"; fi

      - name: upload the dep-map regen patch
        if: ${{ inputs.regen_docs }}
        uses: actions/upload-artifact@v4
        with:
          name: dep-map-regen
          path: ${{ runner.temp }}/dep-map-regen.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: cargo test <cargo_args>
        if: ${{ !inputs.regen_docs }}
        timeout-minutes: 40
        shell: bash
        env:
          CARGO_ARGS: ${{ inputs.cargo_args }}
          AS_ROOT: ${{ inputs.as_root }}
        run: |
          # GitHub starts this shell as `bash -eo pipefail`: errexit is turned off so a red test reaches the result
          # line instead of ending the step at `cargo test` (PR #6 Codex P2).
          set -uo pipefail
          set +e
          [ -n "$CARGO_ARGS" ] || { echo "cargo_args is empty (only regen_docs may omit it)"; exit 2; }
          case "$CARGO_ARGS" in *[!A-Za-z0-9_:./=\ -]*) echo "cargo_args holds characters outside [A-Za-z0-9_:./= -]"; exit 2 ;; esac
          echo "ref=$(git rev-parse HEAD) cargo test $CARGO_ARGS"
          OUT="$RUNNER_TEMP/targeted.out"
          # shellcheck disable=SC2086 # word splitting on purpose; no eval
          if [ "$AS_ROOT" = true ]; then
            # Fail fast: a missing loop mount would make the test red for the wrong reason (repo_shares_pgdata_fs).
            truncate -s 12G "$RUNNER_TEMP/scratch.img" && mkfs.ext4 -q -F "$RUNNER_TEMP/scratch.img" \
              && mkdir -p "$RUNNER_TEMP/scratch" && sudo mount -o loop "$RUNNER_TEMP/scratch.img" "$RUNNER_TEMP/scratch" \
              && sudo chmod 1777 "$RUNNER_TEMP/scratch" || { echo "scratch loop mount failed"; exit 2; }
            sudo -E env "PATH=$PATH" TMPDIR="$RUNNER_TEMP/scratch" CARGO_ARGS="$CARGO_ARGS" bash -c 'umask 000 && cargo test $CARGO_ARGS' 2>&1 | tee "$OUT"
            rc=$?
            # Hand the target dir back to the runner user (test-b does the same) so the cache post step can read it.
            sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo" "$RUNNER_TEMP/scratch"
          else
            cargo test $CARGO_ARGS 2>&1 | tee "$OUT"
            rc=$?
          fi
          # A selector that matches nothing passes with "0 passed": that is no evidence, never a green (PR #6 Codex P2).
          if [ "$rc" -eq 0 ] && ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$OUT"; then
            echo "no test matched the selector: refusing a green with 0 tests run"
            rc=3
          fi
          echo "TARGETED RESULT exit=$rc ref=$(git rev-parse HEAD)"
          exit $rc

  # G-RET-11/G-RET-14 through the same composite action ci.yml's required job calls (T-CI-4). No services and no live
  # provider: the artifacts come from the pinned tarballs, verified by sha256 inside the action.
  rerank-parity:
    name: rerank parity (G-RET-11, G-RET-14)
    if: ${{ inputs.rerank_parity }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The action comes from the checked-out ref (like the setup action above): say so plainly on a ref that predates
      # it instead of failing inside a missing action.
      - name: the ref carries the rerank-parity action
        shell: bash
        run: |
          test -f .github/actions/rerank-parity/action.yml || {
            echo "ref $(git rev-parse HEAD) does not carry .github/actions/rerank-parity: not supported by this workflow"
            exit 2
          }

      # Restores the shared rust-cache, never saves it: only ci.yml writes the cache (#194).
      - uses: ./.github/actions/rerank-parity
        with:
          save_cache: false
