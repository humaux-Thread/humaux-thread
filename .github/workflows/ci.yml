name: CI
# §46 "Repository 第一天启用" + §46.1 G46-1/G80-37 Migration Rehearsal Contract.
# Main branch 不允许红（§46）. Tri-state semantics per §57.1:
#   rule 2: not_applicable 必须打印缺失对象名，不许「扫不到当通过」。
#   rule 3: 依赖运行时基础设施的项（retrieval benchmark / mutation tests /
#           deploy smoke / container scan）Phase 0 无被测对象，输出
#           not_applicable —— 不注释掉、不假绿。
#
# §79.2「跳过不等于通过」——这一条本 workflow 曾经违反过，实测：此前没有任何
# services 段，于是全 workspace **99 个**依赖真库的测试（RLS / SKIP LOCKED 并发 /
# fencing token / outbox 原子性 / 跨租户隔离 / read-your-writes）每次都走可见 SKIP
# 分支，而 `cargo test --workspace` 一路绿灯 —— 绿得毫无信息量。
# 下面的 services 段补上被测对象；`HUMAUX_REQUIRE_DB` / `HUMAUX_REQUIRE_QDRANT`
# 则是防复发的那一半：**声明**了有依赖之后，任何一次跳过都是环境故障、当场变红。
# 删掉 services 段的那次提交会立刻红，而不是三个月后有人发现 RLS 从没被测过。

# Triggers (main line 2026-10-07): the repository went public on GitHub so the
# RAM-heavy part of the gate chain (cargo test --workspace + xtask gates) runs on a
# 16 GB hosted runner instead of the shared 6 GiB Docker VM on the dev Mac. Pushes
# to main and ci/** branches run it; workflow_dispatch is for re-runs.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push supersedes the one still queued (free-tier
# concurrency is shared with the owner's other repositories).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Finding (runs 9-12, strace): gateway/context.rs `executable_fingerprint()` sha256-hashes
  # the WHOLE running executable once per process (OnceLock) — the gateway at startup and
  # every test binary that assembles context. A 272 MiB debug binary on this runner's
  # cold disk took ~20 s, past the 5 s / 15 s listen deadlines of mcp_gateway.rs and
  # ops_listener.rs (x64 runner ~8 s, the dev Mac's SSD well under 1 s). Debuginfo off
  # shrinks dev-profile binaries several-fold; `panicked at file:line` is unaffected
  # (it is a panic location, not debuginfo). The product-side fix — fingerprint at build
  # time instead of hashing the binary at runtime — is a card-39 finding, not CI's call.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # M24 build speed (exp/build-speed runs 38623139052 + 38624334420, ubuntu-24.04-arm, `cargo test --workspace
  # --no-run`, median of 3): default linker cold 149 s / core-crate rebuild 114 s; lld 119 s / 82 s; mold 129 / 86;
  # nightly -Zthreads=8 139 / 92; nightly Cranelift 104 / 77. lld is the stable-toolchain winner; Cranelift's
  # extra 15 s / 5 s needs nightly and is not production-ready, so it is not used. lld is the default linker only
  # on x86_64 Linux, not on our aarch64 runners, hence the explicit flag; it applies to every cargo job here (all
  # run on ubuntu-24.04-arm; the x64 `ci` summary job runs no cargo). The `linker is lld` step in test-a proves it.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  # Every job: the pinned image ubuntu-24.04-arm, not ubuntu-latest — a runner image upgrade must not change what
  # the chain proves; linux/arm64 because §67.2 freezes the production host on ARM and the card-37 scratch images
  # (deploy/images/postgres, qdrant by digest) are pinned --platform linux/arm64: on an x64 runner their builds fail
  # with exit 255 (run 37615291083). 4 vCPU / 16 GB, free on public repositories. The services are the 被测对象,
  # versions aligned with the dev machine (postgres:18 / qdrant v1.19.0).
  #
  # Card 39b CI speed-up (owner, 2026-10-13: "思考怎么能够快速的跑ci"): the one job ran fmt/check/clippy, ~200
  # test binaries (cargo runs them one after another, ~20 min) and the serial lane (~17 min) back to back, 44 min
  # per round trip (run 38317757308). They are four parallel jobs now, each with its own throwaway postgres and
  # qdrant (the same services and env, YAML anchors below), and the required check keeps its name as the
  # summary job at the end. Nothing is skipped or loosened: the same commands run, split across runners.
  lint:
    name: fmt + check + clippy + xtask gates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    services: &services
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          # testkit::fixture_purge refuses any database whose name does not start with
          # `humaux_thread_` (the local-disposable predicate the e2e-seed binding rule uses).
          # On `postgres` every fixture tenant stayed behind and the I-SLOT probe of
          # distill_dispatch_v2 grew red with each test (run 37613916837).
          POSTGRES_DB: humaux_thread_ci
        ports:
          - 5432:5432
        # 没有 health check 的话，migrate 会在库还没起来时抢跑，红得莫名其妙。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    env: &ci-env
      # ADR-0059 D-A: `migrate` refuses to create a 0011 role with the repository
      # placeholder password, so a fresh cluster is provisioned the way production is
      # (runbook §2) in the step below. The migrate principal is the service superuser:
      # outside the §6.2.0 role set, which is what MigratorDbPool::connect requires.
      HUMAUX_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_MIGRATOR_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      # 声明「本次运行有这两个依赖」⇒ 此后任何跳过都是环境故障（见头部注释）。
      HUMAUX_REQUIRE_DB: "1"
      HUMAUX_REQUIRE_QDRANT: "1"
      # The runner has Docker, so the card-37 scratch-source tests must run, never skip (§79.2).
      HUMAUX_REQUIRE_DOCKER: "1"
      # REST port of the qdrant service above (tests default to 6333; stated here so
      # the service block and the tests cannot drift apart silently).
      HUMAUX_TEST_QDRANT_PORT: "6333"

    steps:
      # partitions.rs::registry_survives_a_logical_dump_and_restore execs pg_dump / pg_restore
      # inside the container named `humaux-thread-pg` (the dev container); the service
      # container gets a generated name, so it is renamed once it is up.
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4
        with:
          # contract-impact needs `git diff --name-only <base>` against the PR's real merge
          # base (§80.3) — the default shallow (depth-1) checkout has no base commit to diff
          # against at all.
          fetch-depth: 0

      # Toolchain, cache, gitleaks fixture and the runbook §2 cluster provisioning live in one
      # composite action so the `live` job below provisions its cluster the same way.
      - uses: ./.github/actions/setup

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo xtask architecture-check
        run: cargo xtask architecture-check

      - name: cargo xtask mechanism-registry
        run: cargo xtask mechanism-registry

      - name: cargo xtask config-check
        run: cargo xtask config-check

      # §80.3: the base is the PR merge base, or on a push the merge base with main
      # (`github.event.before` is all zeros on a branch's first push). Computed in its own
      # step because contract_impact.rs's unit test pins the shape of the next line:
      # one `run: cargo xtask contract-impact … --base` line, never a multi-line script.
      - name: contract-impact base
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          before='${{ github.event.before }}'
          # Independent review of PR #1: on a push to main, merge-base(origin/main, HEAD) IS HEAD,
          # so the diff was empty and the gate vacuous. A push compares against the previous
          # head (github.event.before); only a branch's first push (all-zero before) and a
          # dispatch fall back to the merge base with main.
          if [ -z "$base" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            base="$before"
          elif [ -z "$base" ]; then
            git fetch -q origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "CONTRACT_IMPACT_BASE=$base" >> "$GITHUB_ENV"
      - name: cargo xtask contract-impact
        if: ${{ !cancelled() }}
        run: cargo xtask contract-impact --base ${{ env.CONTRACT_IMPACT_BASE }}

      - name: cargo xtask migration-rehearsal
        if: ${{ !cancelled() }}
        run: cargo xtask migration-rehearsal

      # 以下六道此前一道都没接进 CI —— 它们本地全绿，但「本地绿」不是判据，
      # 没在 CI 跑过的闸等于没有人在看。rls-check 需要真库，上面的 services 已提供。
      # metrics-registry D2/D6 compile and RUN every witness file as a throwaway probe
      # package (target/metrics-witness-probe, its own --target-dir
      # target/metrics-witness-probe-out, `--offline`, 120 s per family —
      # xtask/src/metrics_registry.rs run_witness_probe). On the dev Mac the probe's lockfile,
      # registry cache and target dir are warm; on a fresh runner the gate finished in 6 s
      # with every witness "missing" (run 37656756823): the probe resolves its dependencies
      # from scratch and `--offline` cannot. This step lets the xtask write the probe
      # manifest once, resolves and fetches the probe's dependencies ONLINE, pre-compiles
      # them, and prints cargo's own words if any of that fails. The real gate follows.
      - name: warm the metrics witness probe (lockfile, fetch, deps)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo xtask metrics-registry > /dev/null 2>&1
          m=target/metrics-witness-probe/Cargo.toml
          test -f "$m" || { echo "no probe manifest written"; exit 0; }
          cargo generate-lockfile --manifest-path "$m" 2>&1 | tail -5
          cargo fetch --manifest-path "$m" 2>&1 | tail -3
          cargo test --manifest-path "$m" --target-dir target/metrics-witness-probe-out --offline --no-run 2>&1 | tail -15 | cut -c1-200

      - name: cargo xtask metrics-registry
        if: ${{ !cancelled() }}
        run: cargo xtask metrics-registry

      - name: cargo xtask gate-registry
        if: ${{ !cancelled() }}
        run: cargo xtask gate-registry

      - name: cargo xtask r4-fault-manifest
        if: ${{ !cancelled() }}
        run: cargo xtask r4-fault-manifest

      - name: cargo xtask threshold-shape
        if: ${{ !cancelled() }}
        run: cargo xtask threshold-shape

      - name: cargo xtask direction-table
        if: ${{ !cancelled() }}
        run: cargo xtask direction-table

      - name: cargo xtask card-version
        if: ${{ !cancelled() }}
        run: cargo xtask card-version

      - name: cargo xtask rls-check
        if: ${{ !cancelled() }}
        run: cargo xtask rls-check

      # §58 / ADR-0051: every module header, `// dep:` tag and Cargo `# why:` line, and the three generated maps
      # (dependency_map.md, db_objects.md, env_vars.md), must match the tree and the migrated catalog. It was not
      # wired here before, so the maps could drift silently (PR #15 review). On drift the step regenerates the maps
      # and uploads the patch, so the fix comes from CI's own output (owner rule: nothing runs locally).
      - name: cargo xtask dep-map --check
        id: depmap
        if: ${{ !cancelled() }}
        run: |
          if ! cargo xtask dep-map --check; then
            cargo xtask dep-map --write || true
            # Every path --write renders (docs/architecture, deploy/env/example, deploy/env/secret-fixture), new files
            # included: the patch must be enough on its own to turn the next run green.
            git add -A -- docs/architecture deploy/env
            git diff --cached --binary -- docs/architecture deploy/env > "$RUNNER_TEMP/dep-map-drift.patch" || true
            git diff --cached --stat -- docs/architecture deploy/env
            exit 1
          fi

      - name: upload the dep-map drift patch
        if: ${{ failure() && steps.depmap.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: dep-map-drift
          path: ${{ runner.temp }}/dep-map-drift.patch
          if-no-files-found: ignore
          retention-days: 7

      # ADR-0066 D-R (a), §78.1: deploy/env/values/*.env declare exactly the keys their process reads (the generated
      # deploy/env/example/*.env) minus the secret fixture and prod.yml `environment:`, and every sizing profile's gateway
      # ceiling holds the query-embedding cache the gateway values file enables. Clean checkout, no secret; renders prod.yml
      # with `docker compose config`, so HUMAUX_REQUIRE_DOCKER (set for this job) makes a missing docker red, not a skip.
      - name: cargo xtask deploy-env
        if: ${{ !cancelled() }}
        run: cargo xtask deploy-env

      # PHASE 真源的过期闸：下一相位的交付物 marker 已非占位而 PHASE 未前进 ⇒ 红。
      # 「当前状态」型常量写进静态文件的那天就开始腐烂，除非配一道会红的过期闸——
      # PHASE 文件正是那种常量（审计结论，见 xtask/src/phase.rs 模块 doc）。
      - name: cargo xtask phase-check
        if: ${{ !cancelled() }}
        run: cargo xtask phase-check

      # EmbarkStudios/cargo-deny-action runs an x86_64 binary in a container: "Exec format
      # error" on the arm64 runner (run 37656756823). The crate installs natively instead;
      # rust-cache keeps ~/.cargo/bin across runs. Blocking since M24-1 (the wildcard and licence
      # findings of run 38606451978 are fixed in deny.toml / the workspace manifests, not waived).
      - name: cargo-deny check (§78.5)
        if: ${{ !cancelled() }}
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --workspace --all-features check

      # M24-2 / G-M24-2: every commit a PR or push adds is scanned with the pinned gitleaks 8.30.1 the setup action
      # installs (HUMAUX_TEST_GITLEAKS_BIN) and .gitleaks.toml (default rules; the deliberate fake vectors allowlisted by
      # rule + exact path + exact value). The bypass channels are closed: --ignore-gitleaks-allow (an inline
      # `gitleaks:allow` comment silences nothing, as in the product's own seal, ADR-0068) and a .gitleaksignore file
      # fails the step; .gitleaks.toml edits are reviewed like code. The repository is PUBLIC, so the log must never carry
      # a secret: --redact is unconditional, there is no -v, and only RuleID / File:Line / short SHA are printed from the
      # JSON report (the report file stays on the runner). Range = the contract-impact base above..HEAD (PR base; previous
      # head on a push; merge base with main on a branch's first push); the full-depth checkout provides it. An empty range
      # is not_applicable (§57.1). This workflow runs on PRs and on pushes to main and ci/** only; a push to any other
      # branch (exp/*, card/*) is scanned by .github/workflows/secret-scan.yml with the same command: keep the two in step.
      - name: gitleaks secret scan (G-M24-2)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitleaksignore || { echo "::error::.gitleaksignore is not allowed: exempt a fixture in .gitleaks.toml (rule + path + value), reviewed like code"; exit 1; }
          range="${CONTRACT_IMPACT_BASE:?the contract-impact base step did not run}..HEAD"
          n="$(git rev-list --count --no-merges "$range")"
          if [ "$n" -eq 0 ]; then
            echo "not_applicable (missing object: no commits in $range)"
            exit 0
          fi
          report="$RUNNER_TEMP/gitleaks.json"
          rc=0
          "$HUMAUX_TEST_GITLEAKS_BIN" git --no-banner --no-color --redact --ignore-gitleaks-allow --config .gitleaks.toml \
            --log-opts "$range" --report-format json --report-path "$report" . || rc=$?
          echo "gitleaks exit=$rc; $n non-merge commit(s) expected in $range (gitleaks logs the count it scanned above)"
          if [ "$rc" -ne 0 ] && [ -s "$report" ]; then
            jq -r '.[] | "FINDING \(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:12])"' "$report" || true
          fi
          exit "$rc"

      # §46 Day-1 list / §57.1 Phase-0 gate row require SBOM to PASS (not
      # not_applicable): it is generated statically from Cargo.lock, no live
      # infrastructure needed, so it does not qualify for the tri-state
      # not_applicable exception in §57.1 rule 3.
      - name: SBOM (cargo-sbom, §46)
        if: ${{ !cancelled() }}
        run: |
          cargo install cargo-sbom --version 0.10.0 --locked
          cargo sbom --output-format=spdx_json_2_3 > sbom.spdx.json

      # G-M24-4 (M24-4), §57.1 rule 2: `not_applicable` is only for an object that is not yet due, and it names that
      # object; a gate that is due and red (dod-check G80-33, benchset-declaration G80-16, retrieval benchmark, mutation
      # tests, deploy smoke, container scan) is a row in xtask/known_red.toml naming the module card that fixes it.
      # A row whose item passes is red until deleted (§80.1.1 shape), an unlisted red fails here. dod-check executes the
      # registered verifiers (cargo test), hence the step timeout. `--release` is the go-live rehearsal (§69): red for
      # every row without deferred_past_go_live, and it lists each deferred row for owner sign-off.
      - name: cargo xtask known-red (G-M24-4)
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        run: cargo xtask known-red

  test-a:
    name: cargo test (workspace)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services: *services
    env: *ci-env
    steps:
      # partitions.rs::registry_survives_a_logical_dump_and_restore execs pg_dump / pg_restore
      # inside the container named `humaux-thread-pg` (the dev container); the service
      # container gets a generated name, so it is renamed once it is up.
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4

      # Toolchain, cache, gitleaks fixture and the runbook §2 cluster provisioning live in one
      # composite action so the `live` job below provisions its cluster the same way.
      - uses: ./.github/actions/setup

      # M24-6: cargo-nextest (pinned) — every test in its own process, binaries in parallel. Trial ci/nextest-trial:
      # test-a 16.0 → 11.4 min, test-b 13.6 → 9.7 min (run 38640382765). Hidden couplings that cargo test's
      # one-binary-at-a-time order used to mask are declared in .config/nextest.toml test groups (run 38626567082:
      # 54 failures without them) and the throwaway-migration advisory lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148

      - name: cargo test
        # A hung test fails here, not at the job's 90 min (run 38343204163: one test spun 80 min).
        timeout-minutes: 40
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # Quiet pass (alone, -j 1, after the parallel pass): g80_31_handoff asserts a quiet cluster between two
          # snapshot reads; the two derived_dispatch_e2e binaries assert HTTP/lease timing windows. The private E11
          # scenario no longer needs it: its failures (also seen here under -j 1) were a claim race between its pass
          # and its sweeper, not load, and the sweeper now starts only after the pass holds the lease. Whether these
          # binaries can rejoin the parallel pass is a separate decision.
          cargo nextest run --profile ci --workspace --exclude humaux-maintenance --exclude humaux-gateway --exclude humaux-retrieval-provider -E 'not (binary_id(humaux-adapters::g80_31_handoff) | binary_id(humaux-private-worker::derived_dispatch_e2e) | binary_id(humaux-consolidation-worker::derived_dispatch_e2e))' || rc=1
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/junit-a-parallel.xml" 2>/dev/null || true
          cargo nextest run --profile ci --workspace --exclude humaux-maintenance --exclude humaux-gateway --exclude humaux-retrieval-provider -j 1 -E 'binary_id(humaux-adapters::g80_31_handoff) | binary_id(humaux-private-worker::derived_dispatch_e2e) | binary_id(humaux-consolidation-worker::derived_dispatch_e2e)' || rc=1
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/junit-a-quiet.xml" 2>/dev/null || true
          cargo test --doc --workspace --exclude humaux-maintenance --exclude humaux-gateway --exclude humaux-retrieval-provider || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextest-junit-test-a
          overwrite: true
          path: ${{ runner.temp }}/junit-a-*.xml

      # M24: every humaux_domain test binary must carry lld's `.comment` mark. Ubuntu's lld writes
      # "Linker: Ubuntu LLD 18.x", hence the vendor-tolerant pattern; GNU ld writes no "Linker:" line.
      - name: linker is lld (M24)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bins < <(find target/debug/deps -maxdepth 1 -type f -perm -u+x -name 'humaux_domain-*')
          [ "${#bins[@]}" -gt 0 ] || { echo "linker is lld: FAIL (no humaux_domain test binary under target/debug/deps)"; exit 1; }
          bad=0
          for f in "${bins[@]}"; do
            if readelf -p .comment "$f" | grep -q 'Linker: .*LLD'; then echo "linker is lld: pass ($f)"
            else echo "linker is lld: FAIL ($f was not linked by lld)"; readelf -p .comment "$f"; bad=1; fi
          done
          exit $bad

      # The CI twin of the local gate `no_leaked_distill_jobs` (TW c31_leak_check.sh) plus the
      # ADR-0058 §2.1 I-SLOT probe over the whole table: a test binary that leaves claimable
      # or half-claimed DERIVED_* jobs behind breaks every later binary that asserts the
      # invariant, and the leak must be named by tenant, not guessed. Always runs so a red
      # `cargo test` still gets its diagnosis.
      - name: no_leaked_distill_jobs + I-SLOT probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          q() { docker exec "${{ job.services.postgres.id }}" psql -U postgres -d humaux_thread_ci -Atc "$1"; }
          leaked=$(q "select t.name || ' ' || j.job_type || ' tenants=' || count(distinct j.tenant_id) || ' jobs=' || count(*) from ops.jobs j join control.tenants t using (tenant_id) where j.job_type in ('DERIVED_DISTILL','DERIVED_CONSOLIDATE') and j.status = 'PENDING' and t.name like '%throwaway tenant%' group by t.name, j.job_type order by count(*) desc")
          ckpt=$(q "select c.domain || '/' || c.projection_kind || ' tenants=' || count(distinct c.tenant_id) || ' checkpoints=' || count(*) from projection.stream_checkpoints c where (c.domain, c.projection_kind) not in (('private_memory','PRIVATE_MEMORY')) group by c.domain, c.projection_kind order by count(*) desc")
          islot=$(q "select coalesce(t.name, '<no tenant row>') || ' | ' || j.status || ' | ' || coalesce(j.dispatch_state, '-') || ' | gen=' || j.claim_generation || ' | slots=' || (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) || ' | created=' || j.created_at from ops.jobs j left join control.tenants t using (tenant_id) where j.job_type = 'DERIVED_DISTILL' and j.status = 'PROCESSING' and j.dispatch_state is not null and (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) <> 1 order by j.created_at")
          slots=$(q "select slot_no || ' job=' || coalesce(job_id::text, '-') || ' gen=' || coalesce(claim_generation::text, '-') from ops.provider_slots order by 1")
          echo "provider_slots:"; echo "$slots"
          rc=0
          if [ -n "$leaked" ]; then echo "no_leaked_distill_jobs: FAIL (claimable derived jobs on throwaway tenants)"; echo "$leaked"; rc=1; fi
          if [ -n "$ckpt" ]; then echo "no_leaked_distill_jobs: FAIL (stream_checkpoints outside the registered pair)"; echo "$ckpt"; rc=1; fi
          if [ -n "$islot" ]; then echo "i_slot: FAIL (PROCESSING DERIVED_DISTILL rows without exactly one slot)"; echo "$islot"; rc=1; fi
          [ $rc -eq 0 ] && echo "no_leaked_distill_jobs: pass; i_slot: pass"
          exit $rc

  test-b:
    name: cargo test (retrieval-provider, gateway, maintenance)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services: *services
    env: *ci-env
    steps:
      # partitions.rs::registry_survives_a_logical_dump_and_restore execs pg_dump / pg_restore
      # inside the container named `humaux-thread-pg` (the dev container); the service
      # container gets a generated name, so it is renamed once it is up.
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4

      # Toolchain, cache, gitleaks fixture and the runbook §2 cluster provisioning live in one
      # composite action so the `live` job below provisions its cluster the same way.
      - uses: ./.github/actions/setup

      # M24-6: cargo-nextest (pinned) — every test in its own process, binaries in parallel. Trial ci/nextest-trial:
      # test-a 16.0 → 11.4 min, test-b 13.6 → 9.7 min (run 38640382765). Hidden couplings that cargo test's
      # one-binary-at-a-time order used to mask are declared in .config/nextest.toml test groups (run 38626567082:
      # 54 failures without them) and the throwaway-migration advisory lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148

      # --no-fail-fast: one run shows every red binary, not just the first (§57.1 rule 2:
      # a stop at the first failure hides the rest behind it). Three invocations, not one:
      #  · humaux-maintenance under `umask 000`: the card-37 scratch sources bind-mount a
      #    directory the test just created into the postgres container, where pgbackrest
      #    (uid 999) must create `repo` in it. Docker Desktop on the dev Mac maps the owner
      #    silently; native Linux does not (run 37620876690: "unable to create path
      #    '/var/lib/pgbackrest/repo': Permission denied"). World-writable scratch on a
      #    throwaway runner is the smallest equivalent of that mapping.
      #  · humaux-gateway with --test-threads=2: its tests spawn the real gateway binary
      #    under a 5 s listen deadline (mcp_gateway.rs GATEWAY_PROCESS_START_TIMEOUT);
      #    four concurrent bootstraps on the 4-vCPU arm runner missed it, two do not.
      - name: cargo test
        # A hung test fails here, not at the job's 90 min (run 38343204163: one test spun 80 min).
        timeout-minutes: 40
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          # retrieval-provider: four lib tests (adapters::tests::dashscope_query_sut_…,
          # dispatched_transport_failure_…, mark_failure_stops_…, persistent_budget_rejection_…)
          # hard-code the machine-local `127.0.0.1:61719` request-guard container
          # (adapters.rs checked_query_dsn) instead of accepting the repo-wide isolated
          # database like g80_31_handoff.rs does, so under HUMAUX_REQUIRE_DB they can only
          # fail here. Skipped BY NAME, not by unsetting the require flag (§79.2); the
          # portability defect is a follow-up card. Everything else in the package runs.
          cargo nextest run --profile ci -p humaux-retrieval-provider -E 'not (test(=adapters::tests::dashscope_query_sut_commits_exact_batch_provenance_before_transport) | test(=adapters::tests::dispatched_transport_failure_consumes_budget) | test(=adapters::tests::mark_failure_stops_before_transport_and_releases_budget) | test(=adapters::tests::persistent_budget_rejection_stops_before_transport_and_disclosure))' || rc=1
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/junit-provider.xml" 2>/dev/null || true
          # -j 1: gateway tests spawn the real binary and assert 2 s / 5 s barriers; under -j 2 one missed its PG barrier
          # (run 38644754111, native_mcp_context_records_final_metric_only_after_quota_settlement).
          cargo nextest run --profile ci -p humaux-gateway -j 1 || rc=1
          cargo test --doc -p humaux-gateway -p humaux-retrieval-provider || rc=1
          cp target/nextest/ci/junit.xml "$RUNNER_TEMP/junit-gateway.xml" 2>/dev/null || true
          # 10.11 A: the pgbackrest repository must sit on its own filesystem (backup.rs
          # `stat -c %d` of the bind target vs PGDATA refuses `repo_shares_pgdata_fs`). The
          # dev Mac gets that for free (virtiofs); on the runner a loop-mounted ext4 image
          # under TMPDIR is the equivalent of the runbook's loop-mounted repository filesystem.
          truncate -s 12G "$RUNNER_TEMP/scratch.img"
          mkfs.ext4 -q -F "$RUNNER_TEMP/scratch.img"
          mkdir -p "$RUNNER_TEMP/scratch"
          sudo mount -o loop "$RUNNER_TEMP/scratch.img" "$RUNNER_TEMP/scratch"
          sudo chmod 1777 "$RUNNER_TEMP/scratch"
          # drill.rs tampers with repository files the container's postgres user (uid 999)
          # created 0640 — from the host side, as the test's own user. Docker Desktop's
          # virtiofs lets the Mac user through; native Linux needs root for that one package.
          # The target dir is handed back to the runner user afterwards.
          sudo -E env "PATH=$PATH" TMPDIR="$RUNNER_TEMP/scratch" bash -c 'umask 000 && cargo test -p humaux-maintenance --no-fail-fast' || rc=1
          sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo" "$RUNNER_TEMP/scratch"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextest-junit-test-b
          overwrite: true
          path: ${{ runner.temp }}/junit-*.xml

      # test-b runs on its own database, so it gets the same leak / I-SLOT probe (gateway tests write
      # stream_checkpoints, maintenance onboarding enqueues DERIVED_DISTILL; PR #3 independent review P2).
      # The CI twin of the local gate `no_leaked_distill_jobs` (TW c31_leak_check.sh) plus the
      # ADR-0058 §2.1 I-SLOT probe over the whole table: a test binary that leaves claimable
      # or half-claimed DERIVED_* jobs behind breaks every later binary that asserts the
      # invariant, and the leak must be named by tenant, not guessed. Always runs so a red
      # `cargo test` still gets its diagnosis.
      - name: no_leaked_distill_jobs + I-SLOT probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          q() { docker exec "${{ job.services.postgres.id }}" psql -U postgres -d humaux_thread_ci -Atc "$1"; }
          leaked=$(q "select t.name || ' ' || j.job_type || ' tenants=' || count(distinct j.tenant_id) || ' jobs=' || count(*) from ops.jobs j join control.tenants t using (tenant_id) where j.job_type in ('DERIVED_DISTILL','DERIVED_CONSOLIDATE') and j.status = 'PENDING' and t.name like '%throwaway tenant%' group by t.name, j.job_type order by count(*) desc")
          ckpt=$(q "select c.domain || '/' || c.projection_kind || ' tenants=' || count(distinct c.tenant_id) || ' checkpoints=' || count(*) from projection.stream_checkpoints c where (c.domain, c.projection_kind) not in (('private_memory','PRIVATE_MEMORY')) group by c.domain, c.projection_kind order by count(*) desc")
          islot=$(q "select coalesce(t.name, '<no tenant row>') || ' | ' || j.status || ' | ' || coalesce(j.dispatch_state, '-') || ' | gen=' || j.claim_generation || ' | slots=' || (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) || ' | created=' || j.created_at from ops.jobs j left join control.tenants t using (tenant_id) where j.job_type = 'DERIVED_DISTILL' and j.status = 'PROCESSING' and j.dispatch_state is not null and (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) <> 1 order by j.created_at")
          slots=$(q "select slot_no || ' job=' || coalesce(job_id::text, '-') || ' gen=' || coalesce(claim_generation::text, '-') from ops.provider_slots order by 1")
          echo "provider_slots:"; echo "$slots"
          rc=0
          if [ -n "$leaked" ]; then echo "no_leaked_distill_jobs: FAIL (claimable derived jobs on throwaway tenants)"; echo "$leaked"; rc=1; fi
          if [ -n "$ckpt" ]; then echo "no_leaked_distill_jobs: FAIL (stream_checkpoints outside the registered pair)"; echo "$ckpt"; rc=1; fi
          if [ -n "$islot" ]; then echo "i_slot: FAIL (PROCESSING DERIVED_DISTILL rows without exactly one slot)"; echo "$islot"; rc=1; fi
          [ $rc -eq 0 ] && echo "no_leaked_distill_jobs: pass; i_slot: pass"
          exit $rc

  serial-lane:
    name: serial lane (the ignored tier)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services: *services
    env: *ci-env
    steps:
      # partitions.rs::registry_survives_a_logical_dump_and_restore execs pg_dump / pg_restore
      # inside the container named `humaux-thread-pg` (the dev container); the service
      # container gets a generated name, so it is renamed once it is up.
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4

      # Toolchain, cache, gitleaks fixture and the runbook §2 cluster provisioning live in one
      # composite action so the `live` job below provisions its cluster the same way.
      - uses: ./.github/actions/setup

      # The #[ignore = "lane(...)"] tier (§79.2 / ADR-0047, docs/ops/serial-lane.md): the
      # two hand-listed `--ignored` steps that stood here since Phase 0 ran lane tests
      # without the lane's resources (run 37646055641: public_provenance's mutation tests
      # expect HUMAUX_PUBLIC_PROVENANCE_FAULT_DB on a dedicated database — "refusing to
      # alter source guards outside the dedicated mutation database"). The lane runner
      # provisions each resource (per-run databases, the gitleaks fixture, humaux-admin)
      # and runs lane(a)/lane(b) serially after a warm-up; lane(c) is reported, not run.
      - name: cargo xtask serial-lane (the ignored tier)
        timeout-minutes: 45
        run: cargo xtask serial-lane

  # G-M24-3 SAST (§80 "SAST", M24 D3): CodeQL for Rust in build-mode none — it reads the source without compiling,
  # so no services, no cargo, and it runs beside the cargo jobs instead of after them. Results also land in the
  # repository's code-scanning tab. Findings never fail the analyze step (only an upload/processing error does), so
  # the last step decides.
  # Threshold = level error OR security severity >= 7.0 (high/critical). Measured on this card (run 38681752387):
  # every Rust security query ships at level `warning` — an error-only threshold could never go red, while a
  # planted cleartext password log was reported at `high`. Test code (tests/ trees, testkit, xtask, experiments)
  # is out of scope; inline #[cfg(test)] modules cannot be path-filtered and sit in the ledger as verdict T.
  # The accepted findings live in .github/codeql/known_findings.toml, exact count per (rule, path), shrink-only.
  # The CodeQL bundle is pinned: a newer query pack must not turn main red without a PR that re-triages.
  # Free while the repository is public. x64 runner: the CodeQL bundle's Linux build is x64.
  # ponytail: whole-workspace scan on every push (~7 min measured, budget ≤ 15 min in parallel, M24 §7); if it
  # outgrows that, PRs scan changed crates and the full scan moves to nightly (ADR-M24-a).
  sast:
    name: CodeQL (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      # On pull_request events codeql-action defaults to diff-informed queries: data-flow results only on the PR's
      # changed lines (run 38683131940: 13 results vs 102 on a push of the same tree), so every ledger row of an
      # untouched file read 0. The ledger is a whole-tree count, so the scan must be whole-tree on every event.
      # The knob is codeql-action's feature-flag override (src/feature-flags.ts, v4.38.3); the gate step below
      # turns red if a diff-range pack was built anyway, so a renamed knob cannot pass silently.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit: the diff-informed knob and the pr-diff-range path below are the action's internals.
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: rust
          build-mode: none
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:rust
          # A fork PR's token cannot write security events (the upload would 403 and fail the step); the gate below
          # still judges the local SARIF.
          upload: ${{ github.event.pull_request.head.repo.fork && 'never' || 'always' }}
          output: ${{ runner.temp }}/sarif
      - name: findings match the SAST ledger
        # A result's level falls back to its rule's defaultConfiguration (SARIF §3.27.10); CodeQL keeps the rules
        # and their `security-severity` in the query pack's extension, not the driver. No SARIF file = red.
        run: |
          python3 - "${{ runner.temp }}/sarif" .github/codeql/known_findings.toml "${{ runner.temp }}/pr-diff-range" <<'PY'
          import collections, glob, json, os, sys, tomllib
          TEST = ("/tests/", "/benches/", "/crates/testkit/", "/xtask/", "/experiments/")
          if os.path.isdir(sys.argv[3]):
              sys.exit("G-M24-3: diff-informed analysis ran (pr-diff-range pack exists); the ledger needs a whole-tree scan")
          files = glob.glob(sys.argv[1] + "/*.sarif")
          if not files:
              sys.exit("G-M24-3: no SARIF produced")
          seen, total, unresolved = collections.Counter(), 0, set()
          for path in files:
              for run in json.load(open(path))["runs"]:
                  rules = {rule["id"]: rule for comp in [run["tool"]["driver"], *run["tool"].get("extensions", [])]
                           for rule in comp.get("rules", [])}
                  for r in run.get("results", []):
                      total += 1
                      rid = r.get("ruleId") or r.get("rule", {}).get("id")
                      if rid not in rules:
                          unresolved.add(rid)  # no rule = no severity: never let it pass as ungated
                      rule = rules.get(rid, {})
                      level = r.get("level") or rule.get("defaultConfiguration", {}).get("level", "warning")
                      sev = float(rule.get("properties", {}).get("security-severity", 0))
                      uri = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
                      if (level == "error" or sev >= 7.0) and not any(t in "/" + uri for t in TEST):
                          seen[(rid, uri)] += 1
          if unresolved:
              sys.exit(f"G-M24-3: results whose rule is not in the SARIF: {sorted(map(str, unresolved))}")
          rows = tomllib.load(open(sys.argv[2], "rb")).get("finding", [])
          ledger, red = {}, []
          for row in rows:
              key = (row.get("rule"), row.get("path"))
              if key in ledger:
                  red.append(f"duplicate ledger row {key}")
              ledger[key] = row.get("count")
              if row.get("verdict") not in ("T", "FP", "REAL") or not row.get("owner") or not row.get("reason"):
                  red.append(f"ledger row {key} needs verdict T/FP/REAL, owner and reason")
          for key in sorted(set(seen) | set(ledger)):
              have, want = seen.get(key, 0), ledger.get(key, 0)
              if have > want:
                  red.append(f"new finding {key[0]} in {key[1]}: {have} found, {want} accepted")
              elif have < want:
                  red.append(f"ledger row {key[0]} {key[1]} accepts {want} but {have} found — shrink the row")
          print(f"CodeQL results: {total}; gated (non-test, high+ or error): {sum(seen.values())}; ledger rows: {len(rows)}")
          if red:
              sys.exit("G-M24-3:\n" + "\n".join(red))
          PY

  # The required check (branch protection names it): green only when every part above is green; a skipped or
  # cancelled part is red, never a quiet pass (§79.2).
  ci:
    name: fmt + check + clippy + test + gates
    needs: [lint, test-a, test-b, serial-lane, sast]
    if: always()
    # Pinned x64 image: this job only compares five results, and on the arm queue it waited ~5.5 min for a runner
    # after every part had finished (run 38351566010).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every part passed
        run: |
          echo 'lint=${{ needs.lint.result }} test-a=${{ needs.test-a.result }} test-b=${{ needs.test-b.result }} serial-lane=${{ needs.serial-lane.result }} sast=${{ needs.sast.result }}'
          test '${{ needs.lint.result }}' = success
          test '${{ needs.test-a.result }}' = success
          test '${{ needs.test-b.result }}' = success
          test '${{ needs.serial-lane.result }}' = success
          test '${{ needs.sast.result }}' = success

  # Real-provider tests (the local chain's distill_hop_live / distill_fairness_live /
  # distill_poison_live / two_provider_live / consolidation hop / dashscope_live_smoke).
  # Keys come from the `minimax m3` environment the owner created (ALIBABA_CLOUD_API_KEY,
  # MINIMAXAPIKEY); they are mapped onto the names the code reads and never printed.
  # Each run spends provider money, so it runs on pushes to main and on manual dispatch
  # only, never on PRs or ci/** pushes. DNS pins are omitted: the pins exist for the dev
  # Mac's proxy fake-IP resolver (ADR-0039 / ADR-0060) and are optional in every test.
  live:
    name: live providers (MiniMax + DashScope)
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: minimax m3
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          # testkit::fixture_purge refuses any database whose name does not start with
          # `humaux_thread_` (the local-disposable predicate the e2e-seed binding rule uses).
          # On `postgres` every fixture tenant stayed behind and the I-SLOT probe of
          # distill_dispatch_v2 grew red with each test (run 37613916837).
          POSTGRES_DB: humaux_thread_ci
        ports:
          - 5432:5432
        # 没有 health check 的话，migrate 会在库还没起来时抢跑，红得莫名其妙。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    env:
      HUMAUX_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_MIGRATOR_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_REQUIRE_DB: "1"
      HUMAUX_REQUIRE_QDRANT: "1"
      HUMAUX_TEST_QDRANT_PORT: "6333"
      HUMAUX_REQUIRE_MINIMAX: "1"
      HUMAUX_REQUIRE_SECOND_PROVIDER: "1"
      HUMAUX_REQUIRE_DASHSCOPE: "1"
      # ADR-0060 canonical second-provider set (values are not secrets; the key is the
      # variable HUMAUX_LIVE_P2_KEY_ENV names).
      HUMAUX_LIVE_P2_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      HUMAUX_LIVE_P2_HOSTS: dashscope.aliyuncs.com
      HUMAUX_LIVE_P2_MODEL: qwen-plus
      HUMAUX_LIVE_P2_CAPABILITIES: TEXT,STRUCTURED_OUTPUT,TOOL_CALLS,JSON_OBJECT
      HUMAUX_LIVE_P2_REQUEST_EXTRAS: '{"enable_thinking":false}'
      HUMAUX_LIVE_P2_KEY_ENV: DASHSCOPE_API_KEY
      HUMAUX_LIVE_P2_PROVIDER_ID: dashscope
      HUMAUX_LIVE_P2_REGION: cn-beijing
      HUMAUX_LIVE_P2_EGRESS_PROCESSOR_ID: 5cc23460-f4b8-4ca6-8c11-9d5fc4b96cec
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: distill hop (private worker, MiniMax)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_CLOUD_API_KEY }}
        run: cargo test -p humaux-private-worker --test distill_hop_e2e -- --include-ignored

      - name: derived dispatch live tests (fairness, poison, two providers, channel A/B)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_CLOUD_API_KEY }}
        run: cargo test -p humaux-private-worker --test derived_dispatch_e2e -- --include-ignored live

      - name: consolidation hop (MiniMax)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_CLOUD_API_KEY }}
        run: cargo test -p humaux-consolidation-worker --test consolidation_hop_e2e -- --include-ignored

      - name: dashscope live smoke (retrieval provider)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
          DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_CLOUD_API_KEY }}
        run: cargo test -p humaux-retrieval-provider --test dashscope_live_smoke -- --include-ignored
