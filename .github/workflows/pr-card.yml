name: PR card

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: pr-card-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-card:
    name: PR execution card
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: require an execution card or explained exception
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PYTHON'
          import os, re, sys
          title = os.environ["PR_TITLE"]
          if re.search(r"M[0-9]{2}(?:-[A-Za-z0-9]+)+", title):
              print("pass: execution card in PR title")
          elif title.startswith("no-card:") and os.environ["PR_BODY"].strip():
              print("pass: no-card exception; review the body for the documentation/infrastructure reason")
          else:
              sys.exit("fail: expected M\d{2}(-[A-Za-z0-9]+)+ in PR title (e.g. M24-REVIEW-BINDING), or no-card: prefix with a documentation/infrastructure reason in the body")
          PYTHON

