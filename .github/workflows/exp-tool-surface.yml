name: exp tool-surface
# Experiment X2/X4 (MCP tool count / grouping) — runs only on the exp/tool-surface branch, never on main.
# MiniMax only (owner 2026-10-15: no Claude subscription API; the Claude baseline already exists from pilot 2,
# run 38623560203). Direct Anthropic-compatible Messages API calls (run_api.py), ~10x fewer tokens than headless
# Claude Code, with a quota guard on the owner's shared plan: stop when the 5-hour window < 50 % or the weekly
# window < 25 %, or past the run's token budget. Synthetic scenarios only; logs are public, nothing private printed.
on:
  push:
    branches: ['exp/tool-surface']
    paths: ['experiments/tool_surface/**', '.github/workflows/exp-tool-surface.yml']

concurrency:
  group: exp-tool-surface
  cancel-in-progress: true

env:
  EXP_ARMS: A8,B11,C14,D18,E30,P
  EXP_REPS: '1'
  EXP_WORKERS: '2'
  EXP_TOKEN_BUDGET: '12000000'

jobs:
  minimax:
    runs-on: ubuntu-24.04
    environment: minimax m3
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: run episodes (MiniMax-M3, direct API, quota-guarded)
        working-directory: experiments/tool_surface
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
          MINIMAX_MODEL: MiniMax-M3
        run: timeout 170m python3 run_api.py --arms "$EXP_ARMS" --reps "$EXP_REPS" --workers "$EXP_WORKERS" --token-budget "$EXP_TOKEN_BUDGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-minimax-api
          path: experiments/tool_surface/results/
