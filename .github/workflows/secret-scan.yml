# Secret scan on EVERY branch push and PR (M24-2 review W2, gate G-M24-2). ci.yml runs on PRs and on pushes to main and
# ci/** only, so a token pushed to exp/* or card/* would sit unscanned until a PR is opened. Same pinned gitleaks,
# config and command as the `gitleaks secret scan` step of ci.yml (the required check): keep the two in step. Read-only
# token, no cargo, no services; no cancel-in-progress (a superseded run would drop the commits of its range). The repository
# is PUBLIC: --redact always, only RuleID / File:Line / short SHA reach the log. A push to a branch other than main scans
# everything the branch adds over main, so its range never depends on an earlier push.
name: secret-scan
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: gitleaks range scan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install pinned gitleaks 8.30.1 (same pin and checks as .github/actions/setup)
        shell: bash
        run: |
          set -euo pipefail
          archive='gitleaks_8.30.1_linux_arm64.tar.gz'
          archive_sha256='e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080'
          release='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          curl --fail --location --silent --show-error "$release/gitleaks_8.30.1_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          grep -Fqx "$archive_sha256  $archive" "$RUNNER_TEMP/checksums.txt"
          curl --fail --location --silent --show-error "$release/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$archive_sha256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version | tr -d '\r\n')" = '8.30.1'
      - name: gitleaks range scan (G-M24-2)
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .gitleaksignore || { echo "::error::.gitleaksignore is not allowed: exempt a fixture in .gitleaks.toml (rule + path + value), reviewed like code"; exit 1; }
          if [ -n "$PR_BASE" ]; then base="$PR_BASE"
          elif [ "$GITHUB_REF" = refs/heads/main ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
          else base="$(git merge-base origin/main HEAD || true)"; fi
          range="${base:+$base..}HEAD"
          n="$(git rev-list --count --no-merges "$range")"
          if [ "$n" -eq 0 ]; then
            echo "not_applicable (missing object: no commits in $range)"
            exit 0
          fi
          report="$RUNNER_TEMP/gitleaks.json"
          rc=0
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact --ignore-gitleaks-allow --config .gitleaks.toml \
            --log-opts "$range" --report-format json --report-path "$report" . || rc=$?
          echo "gitleaks exit=$rc; $n non-merge commit(s) expected in $range (gitleaks logs the count it scanned above)"
          if [ "$rc" -ne 0 ] && [ -s "$report" ]; then
            jq -r '.[] | "FINDING \(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:12])"' "$report" || true
          fi
          exit "$rc"
