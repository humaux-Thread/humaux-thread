# deploy/postgres/sizing-a5.conf — PostgreSQL numbers for the A5 node (§67.2: 24 GB host; pg cgroup 7168 MiB,
# ADR-0066 D-G). Included by postgresql.conf from /etc/humaux/pg-sizing.conf.
# Every line: dev-host start value, A5 re-measure required (ADR-0066 R-10).
# max_connections = 190 = 152 counted consumers x 1.25 headroom (D-G table). Gate c39_pg_connect_sites pins the DbPool::connect
# call sites only; the arithmetic (sum of pool maxima x headroom <= max_connections = 190) is recorded in ADR-0066 D-E / D-G.
# Memory: shared_buffers 2 GiB + 190 x 4.4 MB backend contexts + work_mem 8 MB x 2 x ~40 active + autovacuum
# 3 x 256 MB + maintenance_work_mem 512 MB ~= 4.7 GiB; the rest of the 7 GiB cgroup is page cache
# (PR #2 round 8: 1.5 GiB moved to the concurrent restore drill, budget_sums.sh).
max_connections = 190
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 8MB
maintenance_work_mem = 512MB
autovacuum_work_mem = 256MB
max_wal_size = 2GB
min_wal_size = 512MB
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
