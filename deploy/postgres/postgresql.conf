# deploy/postgres/postgresql.conf — the static PostgreSQL 18 settings of the bundle's `pg` service (ADR-0066 D-G).
# prod.yml starts `postgres -c config_file=/etc/humaux/postgresql.conf` with this file mounted read-only; the numbers
# that scale with the host live in the sizing conf mounted at /etc/humaux/pg-sizing.conf (sizing-a5.conf /
# sizing-rehearsal.conf, chosen by HUMAUX_PG_SIZING_CONF of the sizing env). No ALTER SYSTEM: state stays in git.
# data_directory / hba_file are the image's (PGDATA, the initdb-written pg_hba.conf: scram for every host line).
# listen_addresses is NOT here: prod.yml passes `-c listen_addresses=${HUMAUX_PG_LISTEN_ADDRESSES}` because
# `restore pitr` boots the restored cluster socket-only through that variable (card 37 D-U, drill.rs).
# Every value: dev-host start value, A5 re-measure required (ADR-0066 R-10).
password_encryption = scram-sha-256

# WAL + archiving for pgBackRest (card 37 / ADR-0064 D-V; stanza `humaux`, deploy/pgbackrest/pgbackrest.conf).
# Constraint (card 37 SP-10): pg_wal peak <= archive-push-queue-max 2 GiB + max_wal_size + 3 x 16 MiB.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=humaux archive-push %p'
archive_timeout = 3600
checkpoint_timeout = 15min
wal_compression = zstd

# Container: no huge pages (the cgroup has none reserved); dynamic shared memory lives in /dev/shm (compose shm_size).
huge_pages = off
dynamic_shared_memory_type = posix
random_page_cost = 1.1
shared_preload_libraries = ''

log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000

include_if_exists = '/etc/humaux/pg-sizing.conf'
