# deploy/postgres/sizing-rehearsal.conf — PostgreSQL numbers for the clean-node rehearsal on the dev Mac (pg cgroup
# 1024 MiB, ADR-0066 D-G, §5). Included by postgresql.conf from /etc/humaux/pg-sizing.conf.
# Every line: dev-host start value, A5 re-measure required (ADR-0066 R-10).
# max_connections is A5's 190: the D-G arithmetic counts processes, not RAM (sqlx pools open lazily, so it is a bound).
max_connections = 190
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
max_wal_size = 1GB
min_wal_size = 256MB
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
