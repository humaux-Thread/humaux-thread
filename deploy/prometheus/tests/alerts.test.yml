  # capacity CPU critical (M22-3 D3): 0.90 busy and PSI cpu some 0.25 fire after the 5 m `for:`; 0.90 with PSI 0.10
  # (corroboration missing) and 0.80 with PSI 0.90 (busy below the line) both stay silent.
  - interval: 1m
