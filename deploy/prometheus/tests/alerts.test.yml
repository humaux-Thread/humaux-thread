# promtool unit tests for the §42 rows in alerts.rules.yml (ADR-0061 D-E). Each alert has a firing
# and a silent case (Watchdog: two firing checks, it has no silent state), and each `absent(...)`
# branch of a multi-branch alert has its own firing case with only that family missing, so deleting
# any one branch is red (ADR-0061 review-fix 3, F6); mutations.sh proves each case catches its mutation. Measured promtool 3.15.0 semantics (research addendum W6): an absent
# family is an omitted input series; `exp_alerts: []` asserts "not firing", so a pending alert
# (inside its `for:`) also reads as [].
rule_files:
  - ../alerts.rules.yml

evaluation_interval: 1m

tests:
  # core silent: the three core families are exported.
  - interval: 1m
    input_series:
      - series: 'humaux_retrieval_requests_total{intent="text",completeness_class="complete"}'
        values: '0x10'
      - series: 'degrade_total{code="ProjectionLag"}'
        values: '0x10'
      - series: 'humaux_mcp_requests_total{tool="recall",result="ok",plan_class="unclassified"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CoreMetricAbsent
        exp_alerts: []

  # core fire, branch 2: degrade_total dropped from the exporter while the other two stay.
  - interval: 1m
    input_series:
      - series: 'humaux_retrieval_requests_total{intent="text",completeness_class="complete"}'
        values: '0x10'
      - series: 'humaux_mcp_requests_total{tool="recall",result="ok",plan_class="unclassified"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CoreMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # core fire, branch 1: humaux_retrieval_requests_total dropped while the other two stay.
  - interval: 1m
    input_series:
      - series: 'degrade_total{code="ProjectionLag"}'
        values: '0x10'
      - series: 'humaux_mcp_requests_total{tool="recall",result="ok",plan_class="unclassified"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CoreMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # core fire, branch 3: humaux_mcp_requests_total dropped while the other two stay.
  - interval: 1m
    input_series:
      - series: 'humaux_retrieval_requests_total{intent="text",completeness_class="complete"}'
        values: '0x10'
      - series: 'degrade_total{code="ProjectionLag"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: CoreMetricAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # lag fire: constant 200 is pending at 9m and firing at 11m (`for` 10m).
  - interval: 1m
    input_series:
      - series: 'projection_lag_events'
        values: '200x20'
    alert_rule_test:
      - eval_time: 9m
        alertname: ProjectionLagExceedsSLO
        exp_alerts: []
      - eval_time: 11m
        alertname: ProjectionLagExceedsSLO
        exp_alerts:
          - exp_labels:
              severity: critical

  # lag silent: constant 50 never crosses 100.
  - interval: 1m
    input_series:
      - series: 'projection_lag_events'
        values: '50x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: ProjectionLagExceedsSLO
        exp_alerts: []

  # dead fire: one job goes DEAD at 3m.
  - interval: 1m
    input_series:
      - series: 'jobs_dead'
        values: '0 0 0 1x27'
    alert_rule_test:
      - eval_time: 10m
        alertname: QueueDeadLetterIncrease
        exp_alerts:
          - exp_labels:
              severity: warning

  # dead silent: a constant DEAD count is not an increase.
  - interval: 1m
    input_series:
      - series: 'jobs_dead'
        values: '1x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: QueueDeadLetterIncrease
        exp_alerts: []

  # backup fire: the timestamp never advances past 0; at 26h1m time() - 0 exceeds 26 h.
  - interval: 1m
    input_series:
      - series: 'backup_last_success_timestamp_seconds{target="local"}'
        values: '0x1600'
    alert_rule_test:
      - eval_time: 26h1m
        alertname: BackupFailure
        exp_alerts:
          - exp_labels:
              severity: critical
              target: local

  # backup silent: the timestamp tracks time() (test clock starts at 0).
  - interval: 1m
    input_series:
      - series: 'backup_last_success_timestamp_seconds{target="local"}'
        values: '0+60x1600'
    alert_rule_test:
      - eval_time: 26h1m
        alertname: BackupFailure
        exp_alerts: []

  # health silent: the sampler's three gauges are present.
  - interval: 1m
    input_series:
      - series: 'data_disclosures_reserved_unfinalized{age_bucket="gt_60s"}'
        values: '0x10'
      - series: 'jobs_dead'
        values: '0x10'
      - series: 'projection_lag_events'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: HealthGaugesAbsent
        exp_alerts: []

  # health fire, branch 1: reserved_unfinalized is gone (a 503 scrape marks it stale); pending at 1m,
  # firing at 3m.
  - interval: 1m
    input_series:
      - series: 'jobs_dead'
        values: '0x10'
      - series: 'projection_lag_events'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HealthGaugesAbsent
        exp_alerts: []
      - eval_time: 3m
        alertname: HealthGaugesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # health fire, branch 2: jobs_dead is gone while the other two stay.
  - interval: 1m
    input_series:
      - series: 'data_disclosures_reserved_unfinalized{age_bucket="gt_60s"}'
        values: '0x10'
      - series: 'projection_lag_events'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: HealthGaugesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # health fire, branch 3: projection_lag_events is gone while the other two stay.
  - interval: 1m
    input_series:
      - series: 'data_disclosures_reserved_unfinalized{age_bucket="gt_60s"}'
        values: '0x10'
      - series: 'jobs_dead'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: HealthGaugesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # distill fire (§42 injection: a parser stub that always returns an empty array): runs rise one per
  # minute, outputs stay flat, so over the 1h window runs increased and outputs did not.
  - interval: 1m
    input_series:
      - series: 'private_distill_runs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+1x70'
      - series: 'private_distill_outputs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DistillNoOutput
        exp_alerts:
          - exp_labels:
              severity: critical
              job: humaux-private-worker
              mode: distill-serve

  # distill silent: runs and outputs both rise.
  - interval: 1m
    input_series:
      - series: 'private_distill_runs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+1x70'
      - series: 'private_distill_outputs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+2x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DistillNoOutput
        exp_alerts: []

  # distill silent: neither moves (an idle stage is not a stalled one).
  - interval: 1m
    input_series:
      - series: 'private_distill_runs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0x70'
      - series: 'private_distill_outputs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DistillNoOutput
        exp_alerts: []

  # watchdog: firing from the first evaluation, with no input at all.
  - interval: 1m
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none

  # maintenance fire (§42 injection: a revoked door on a throwaway database), as the daemon really exports it:
  # clean scrapes with failed = 0 until 10m; the revoke makes every cycle fail, `/metrics` answers 503 and the
  # 11m scrape marks the series stale; no sample until the re-grant; the first clean scrape at 31m reads the
  # failed calls counted meanwhile. During the outage this row is silent and MaintenanceCountersAbsent fires;
  # after the re-grant this row fires with the task's labels and the absent row clears.
  - interval: 1m
    input_series:
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="quota_reservations",outcome="failed"}'
        values: '0x10 stale _x19 7x30'
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="lost",outcome="ok"}'
        values: '0+1x10 stale _x19 40+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MaintenanceTaskFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: MaintenanceCountersAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
      - eval_time: 35m
        alertname: MaintenanceTaskFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: humaux-maintenance
              mode: serve
              task: quota_reservations
              outcome: failed
      - eval_time: 35m
        alertname: MaintenanceCountersAbsent
        exp_alerts: []

  # maintenance absent: the daemon was never scraped (dead before its first answer, or not in the targets file);
  # pending at 1m, firing at 3m.
  - interval: 1m
    input_series:
      - series: 'jobs_dead'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: MaintenanceCountersAbsent
        exp_alerts: []
      - eval_time: 3m
        alertname: MaintenanceCountersAbsent
        exp_alerts:
          - exp_labels:
              severity: warning

  # maintenance silent: every call succeeds (ok rises), failed stays 0 — dropping the outcome matcher fires here.
  - interval: 1m
    input_series:
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="quota_reservations",outcome="failed"}'
        values: '0x70'
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="lost",outcome="ok"}'
        values: '0+1x70'
    alert_rule_test:
      - eval_time: 30m
        alertname: MaintenanceTaskFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: MaintenanceCountersAbsent
        exp_alerts: []

  # partition horizon short (card 36, ADR-0063 D-F; §42 injection: the monthly create-partitions run skipped once):
  # the ledger's horizon is 1, the others 2 and 3 — only the ledger fires, labelled by `table` alone (the `min by`
  # drops job and mode). The same horizon 1 keeps Exhausted silent.
  - interval: 1m
    input_series:
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="model_call_ledger"}'
        values: '1x90'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="events"}'
        values: '2x90'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="stage_runs"}'
        values: '3x90'
    alert_rule_test:
      - eval_time: 59m
        alertname: PartitionHorizonShort
        exp_alerts: []
      - eval_time: 61m
        alertname: PartitionHorizonShort
        exp_alerts:
          - exp_labels:
              severity: warning
              table: model_call_ledger
      - eval_time: 61m
        alertname: PartitionHorizonExhausted
        exp_alerts: []

  # partition horizon silent: every table has 2 or 3 months ahead (the month after a create-partitions run); the
  # family is present, so Absent is silent too.
  - interval: 1m
    input_series:
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="model_call_ledger"}'
        values: '2x150'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="audit_events"}'
        values: '3x150'
    alert_rule_test:
      - eval_time: 140m
        alertname: PartitionHorizonShort
        exp_alerts: []
      - eval_time: 140m
        alertname: PartitionHorizonExhausted
        exp_alerts: []
      - eval_time: 140m
        alertname: PartitionHorizonAbsent
        exp_alerts: []

  # partition horizon exhausted (§42 injection: three monthly runs skipped): events' last leaf is the current
  # month (0) and stage_runs has no leaf at all (-1); both fire after 10m, audit_events (1) does not.
  - interval: 1m
    input_series:
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="events"}'
        values: '0x30'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="stage_runs"}'
        values: '-1x30'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="audit_events"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: PartitionHorizonExhausted
        exp_alerts: []
      - eval_time: 11m
        alertname: PartitionHorizonExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              table: events
          - exp_labels:
              severity: critical
              table: stage_runs

  # partition horizon absent (§42 injection: REVOKE SELECT ON control.partition_registry FROM role_maintenance on a
  # throwaway database, T-K3): PARTITIONS fails every run, so the family is never rendered while the daemon's
  # counters are; pending until 2h, firing after.
  - interval: 1m
    input_series:
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="partitions",outcome="failed"}'
        values: '0+1x150'
    alert_rule_test:
      - eval_time: 119m
        alertname: PartitionHorizonAbsent
        exp_alerts: []
      - eval_time: 121m
        alertname: PartitionHorizonAbsent
        exp_alerts:
          - exp_labels:
              severity: critical

  # a failed PARTITIONS run as the daemon really exports it (ADR-0063 D-K, ADR-0062 D-A): clean scrapes until 10m;
  # the revoke makes the run fail, `/metrics` answers 503 and every series goes stale (the horizon family is also
  # reset); after the re-grant at 31m the family is back and the first clean scrape reads the failed run, so
  # MaintenanceTaskFailing fires with task="partitions" while the 20-minute gap is far below Absent's 2h.
  - interval: 1m
    input_series:
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="partitions",outcome="failed"}'
        values: '0x10 stale _x19 1x30'
      - series: 'maintenance_task_runs_total{job="humaux-maintenance",mode="serve",task="partitions",outcome="ok"}'
        values: '0+1x10 stale _x19 11+1x30'
      - series: 'partition_horizon_months{job="humaux-maintenance",mode="serve",table="model_call_ledger"}'
        values: '3x10 stale _x19 3x30'
    alert_rule_test:
      - eval_time: 35m
        alertname: MaintenanceTaskFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: humaux-maintenance
              mode: serve
              task: partitions
              outcome: failed
      - eval_time: 35m
        alertname: PartitionHorizonAbsent
        exp_alerts: []

  # backup not offsite (ADR-0064 10.11 F): a standing notice built from no series — firing with no input at all,
  # from the first evaluation on. It has no silent state in card 37 (two firing checks, like Watchdog).
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: BackupNotOffsite
        exp_alerts:
          - exp_labels:
              severity: warning
              repo_class: local_only
            exp_annotations:
              summary: "card 37 keeps every backup copy on this host; host loss = total loss; card 37d adds the NAS pull mirror (ADR-0064 E17)"
      - eval_time: 2h
        alertname: BackupNotOffsite
        exp_alerts:
          - exp_labels:
              severity: warning
              repo_class: local_only
            exp_annotations:
              summary: "card 37 keeps every backup copy on this host; host loss = total loss; card 37d adds the NAS pull mirror (ADR-0064 E17)"

  # restore drill fire: the newest succeeded drill finished eight days before the test clock's start (time() = 0 at
  # 0m), so at 1m time() - (-691200) exceeds the 8-day line by one minute. A negative timestamp keeps the case at 1m
  # instead of 11k evaluations of every rule (evaluation_interval is file-wide).
  - interval: 1m
    input_series:
      - series: 'restore_drill_last_success_timestamp_seconds{target="local"}'
        values: '-691200x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: RestoreDrillFailure
        exp_alerts:
          - exp_labels:
              severity: critical
              target: local

  # restore drill silent: the newest succeeded drill finished a week (604800 s) before the test clock's start.
  - interval: 1m
    input_series:
      - series: 'restore_drill_last_success_timestamp_seconds{target="local"}'
        values: '-604800x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: RestoreDrillFailure
        exp_alerts: []

  # WAL archive failing fire: the latch reads 1 from 5m on; pending inside its 15m, firing at 25m.
  - interval: 1m
    input_series:
      - series: 'wal_archive_failing'
        values: '0x5 1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: WalArchiveFailing
        exp_alerts:
          - exp_labels:
              severity: critical

  # WAL archive failing silent: archiving works, the gauge stays 0.
  - interval: 1m
    input_series:
      - series: 'wal_archive_failing'
        values: '0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: WalArchiveFailing
        exp_alerts: []

  # backup budget low fire: a refusal row left the repo_max headroom negative for over an hour.
  - interval: 1m
    input_series:
      - series: 'backup_budget_headroom_bytes{limit="repo_max"}'
        values: '-1500x90'
      - series: 'backup_budget_headroom_bytes{limit="free_floor"}'
        values: '2147483648x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupBudgetLow
        exp_alerts:
          - exp_labels:
              severity: warning
              limit: repo_max

  # backup budget low silent: both headrooms positive (and 0 before the first receipt is not below 0).
  - interval: 1m
    input_series:
      - series: 'backup_budget_headroom_bytes{limit="repo_max"}'
        values: '0x90'
      - series: 'backup_budget_headroom_bytes{limit="free_floor"}'
        values: '2147483648x90'
    alert_rule_test:
      - eval_time: 65m
        alertname: BackupBudgetLow
        exp_alerts: []

  # disk free low fire: the PGDATA filesystem drops to 7 GiB; the repo volume's own low value does not page.
  - interval: 1m
    input_series:
      - series: 'backup_disk_free_bytes{volume="pgdata"}'
        values: '7516192768x30'
      - series: 'backup_disk_free_bytes{volume="repo"}'
        values: '1073741824x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DiskFreeLow
        exp_alerts:
          - exp_labels:
              severity: critical
              volume: pgdata

  # disk free low silent: 8 GiB free on PGDATA is above the 7.5 GiB line.
  - interval: 1m
    input_series:
      - series: 'backup_disk_free_bytes{volume="pgdata"}'
        values: '8589934592x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DiskFreeLow
        exp_alerts: []

  # admission rejected fire (§42 injection: admission capped at 1, two concurrent requests ⇒ one 503): the gateway
  # exports the seeded zero series; one queue_full refusal at 10m fires the row with that reason's labels, and the
  # other reasons stay silent.
  - interval: 1m
    input_series:
      - series: 'admission_rejected_total{job="humaux-gateway",class="gateway_inbound",reason="queue_full"}'
        values: '0x9 1x20'
      - series: 'admission_rejected_total{job="humaux-gateway",class="gateway_inbound",reason="wait_timeout"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: AdmissionRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              job: humaux-gateway
              class: gateway_inbound
              reason: queue_full

  # admission rejected silent: no 503 at all (every series flat at its seeded 0), and 5 minutes after the last
  # refusal the increase is 0 again.
  - interval: 1m
    input_series:
      - series: 'admission_rejected_total{job="humaux-gateway",class="gateway_inbound",reason="queue_full"}'
        values: '0x9 1x30'
      - series: 'admission_rejected_total{job="humaux-gateway",class="gateway_inbound",reason="key_limit"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: AdmissionRejected
        exp_alerts: []
      - eval_time: 25m
        alertname: AdmissionRejected
        exp_alerts: []

  # DNS pin deferred fire (§42 injection, ADR-0066 D-P: the pinned address stops answering ⇒ every distill call is a
  # TRANSPORT retry): deferrals rise one per minute, outputs stay flat. The condition holds from the second sample, so
  # at 10m the alert is still pending (for: 15m) and at 45m it fires.
  - interval: 1m
    input_series:
      - series: 'dns_pin_deferred_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+1x60'
      - series: 'private_distill_outputs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: DnsPinDeferred
        exp_alerts: []
      - eval_time: 45m
        alertname: DnsPinDeferred
        exp_alerts:
          - exp_labels:
              severity: warning
              job: humaux-private-worker
              mode: distill-serve

  # DNS pin deferred silent: deferrals rise but outputs grow too — a provider blip the retries absorbed, not a dead pin
  # (dropping the `and outputs == 0` clause makes this block fire: mutation dns_pin_and).
  - interval: 1m
    input_series:
      - series: 'dns_pin_deferred_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+1x60'
      - series: 'private_distill_outputs_total{job="humaux-private-worker",mode="distill-serve"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: DnsPinDeferred
        exp_alerts: []
