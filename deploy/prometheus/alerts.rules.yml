# §42 alert rows loaded by cards 34, 34b, 35, 36, 37 and 38 (ADR-0061 D-E, ADR-0062 D-S, ADR-0063 D-F, ADR-0064 D-K, ADR-0065 D-C). Each §42 expression is copied literally from the
# §42 table; metric names and label keys are §41.2 rows (freezes ① and ④, checked by
# `cargo xtask metrics-registry --check` D8). The other §42 rows wait for a producer and a red
# record (freeze ②, §80.1); they are listed in ADR-0061 limits.
# The `humaux-capacity` group is not a §42 row: it is module_design_M22 D3/D4 deploy config
# (`thresholds live here, never in Rust`, §78.1; B23 values as starting values, X-M22-3 final)
# over the M22-1 /proc gauges and the M22-2 tenant gauges.
# Every alert here has a firing and a silent case in tests/alerts.test.yml, and at least one balanced token
# mutation in mutations.sh that the tests must catch; every recording rule has an exact-value case and one too.
groups:
  - name: humaux-alerts
    rules:
      # §42 "core metric absent": the runtime twin of §80.2 — a family dropped from a live exporter.
      - alert: CoreMetricAbsent
        expr: absent(humaux_retrieval_requests_total) or absent(degrade_total) or absent(humaux_mcp_requests_total)
        labels:
          severity: critical

      # §42 "projection lag exceeds SLO". No `by (stream)`: the family is unlabeled (§42 freeze ④).
      - alert: ProjectionLagExceedsSLO
        expr: max(projection_lag_events) > 100
        for: 10m
        labels:
          severity: critical

      # §42 "queue dead letter increase".
      - alert: QueueDeadLetterIncrease
        expr: delta(jobs_dead[15m]) > 0
        labels:
          severity: warning

      # §42 "backup failure": 26 h without a new VERIFIED local backup set. Produced by the DR_EVIDENCE task of
      # `humaux-maintenance --serve` (ADR-0064 D-K): the stop time of the newest set whose latest receipt the table
      # derived as VERIFIED; `target` has the one value `local` (ruling E17).
      - alert: BackupFailure
        expr: time() - backup_last_success_timestamp_seconds{target="local"} > 93600
        labels:
          severity: critical

      # §42 "health gauges absent" (ADR-0061 D-D, ruling E8): INV-3, the lag row and the DEAD row have
      # no absent branch, so a dead or failing `humaux-maintenance health serve` (its /metrics answers
      # 503 and the series go stale) would silence all three. Only §41.2 names, no label key.
      - alert: HealthGaugesAbsent
        expr: absent(data_disclosures_reserved_unfinalized) or absent(jobs_dead) or absent(projection_lag_events)
        for: 2m
        labels:
          severity: critical

      # §42 "no-output stage" (card 34b): distill runs finish while no memory record is written — the
      # stage is alive but produces nothing (same shape as §53.5 INV-1). Both families are exported by
      # humaux-private-worker (ADR-0061 D-C); the row gives no `for:`.
      - alert: DistillNoOutput
        expr: increase(private_distill_runs_total[1h]) > 0 and increase(private_distill_outputs_total[1h]) == 0
        labels:
          severity: critical

      # §42.1 heartbeat: always firing, routed alone to the external dead-man receiver
      # (alertmanager.yml). Its payload carries external_labels.git_sha (prometheus.yml).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none

      # §42 "maintenance task failing" (card 35, ADR-0062 D-S, ruling E3): a scheduled maintenance door call
      # failed in the last hour. Exported only by `humaux-maintenance --serve` (ADR-0061 D-C); `outcome` is the
      # §41.2 closed set ok | failed. While a failure lasts `/metrics` answers 503 (ADR-0062 D-A), so no sample is
      # scraped: this row is the record read on the first clean scrape after recovery, and the live signal is
      # MaintenanceCountersAbsent below.
      - alert: MaintenanceTaskFailing
        expr: increase(maintenance_task_runs_total{outcome="failed"}[1h]) > 0
        labels:
          severity: warning

      # §42 "maintenance counters absent" (card 35 fix pass, ADR-0062 D-S): the daemon is dead, never scraped, or
      # answering 503 (a failed door call, an unreachable database, no cycle finished yet) — a failed scrape marks
      # its series stale. The HealthGaugesAbsent shape for the eighth ops pair; only a §41.2 name, no label key.
      - alert: MaintenanceCountersAbsent
        expr: absent(maintenance_task_runs_total)
        for: 2m
        labels:
          severity: warning

      # §42 "partition horizon short" (card 36, ADR-0063 D-F): the §48.1 tables have no DEFAULT partition, so the
      # first insert past the last pre-created month fails with 23514 for every tenant at once — and most
      # repositories map 23514 to 409/400 (ADR-0063 L15), so the outage itself is invisible to 5xx monitoring. These
      # three rows are the alarm. `partition_horizon_months{table}` is exported by `humaux-maintenance --serve`'s
      # PARTITIONS task: 3 right after the monthly `retention create-partitions --months-ahead 3`, 2 during the
      # following month, <= 1 after one missed run (two months before the outage); -1 for a table with no leaf.
      - alert: PartitionHorizonShort
        expr: min by (table) (partition_horizon_months) <= 1
        for: 1h
        labels:
          severity: warning

      # §42 "partition horizon exhausted" (ADR-0063 D-F): the current month's leaf is the last one (or the table has
      # none), so inserts fail from 00:00 UTC on the next 1st. `for: 600s` is §42's 10m, spelled so the `lag` row
      # of mutations.sh keeps the only 10-minute `for:` token of this file.
      - alert: PartitionHorizonExhausted
        expr: min by (table) (partition_horizon_months) <= 0
        for: 600s
        labels:
          severity: critical

      # §42 "partition horizon absent" (ADR-0063 D-F / D-K): PARTITIONS never succeeded since boot or its last run
      # failed — a failed run removes every series of the family instead of keeping the last value — or the daemon
      # is not scraped. The HealthGaugesAbsent shape; only a §41.2 name, no label key.
      - alert: PartitionHorizonAbsent
        expr: absent(partition_horizon_months)
        for: 2h
        labels:
          severity: critical

      # §72.2.1 "quota window renewal missing" (card W0, ADR-0072 D-D): some renewing tenant's latest issued quota
      # window ends within 7 days, so the QUOTA_RENEWAL task has not staged its successor although the 14-day lead
      # (HUMAUX_MAINTENANCE_SERVE_QUOTA_RENEWAL_LEAD_SECONDS) has passed; at that end every call of the tenant turns
      # ENTITLEMENT_REQUIRED / QUOTA_EXHAUSTED. `quota_window_horizon_seconds` is measured at scrape time, so a renewal
      # that stopped running drifts into this alert. Only a §41.2 name, no label key.
      - alert: QuotaWindowRenewalMissing
        expr: min(quota_window_horizon_seconds) < 604800
        for: 30m
        labels:
          severity: critical

      # §42 "authority I4 违规" (M21-2, ADR-0123 D3, §59.1 G59-4 / §65): the daily report-only scan found rows where
      # `(status = 'superseded') != (superseded_by IS NOT NULL)`. `authority_i4_violations` is exported by
      # `humaux-maintenance --serve`'s AUTHORITY_I4 task, set once per successful scan and removed (never left at 0)
      # when a scan fails, so a broken scan is never read as clean. The count is held until the next daily run; no
      # `for:` (§42 freezes the expression, and the row has no hold time). Only a §41.2 name, no label key.
      - alert: AuthorityI4Violation
        expr: authority_i4_violations > 0
        labels:
          severity: critical

      # §42 "backup not offsite" (ADR-0064 E17 / 10.11 F): a standing notice built from no series, so a restart or
      # a scrape gap can neither resolve nor re-fire it. Card 37 keeps every copy on the database host; the
      # notice stays until card 37d adds the NAS pull mirror. Routed weekly (alertmanager.yml).
      - alert: BackupNotOffsite
        expr: label_replace(vector(0), "repo_class", "local_only", "", "")
        labels:
          severity: warning
        annotations:
          summary: "card 37 keeps every backup copy on this host; host loss = total loss; card 37d adds the NAS pull mirror (ADR-0064 E17)"

      # §42 "restore drill failure" (ADR-0064 D-K): eight days without a drill the table derived as succeeded
      # (the drill runs weekly from the host crontab).
      - alert: RestoreDrillFailure
        expr: time() - restore_drill_last_success_timestamp_seconds > 691200
        labels:
          severity: critical

      # §42 "WAL archive failing" (ADR-0064 10.11 D): latched in ops.wal_archive_failures by DR_EVIDENCE until a
      # VERIFIED full starts later, so a recovered archiver or a stats reset does not clear it. PostgreSQL keeps
      # running (archive-push-queue-max caps pg_wal); the PITR window is broken until the next verified full.
      - alert: WalArchiveFailing
        expr: wal_archive_failing > 0
        for: 15m
        labels:
          severity: critical

      # §42 "backup budget low" (ADR-0064 D-V / 10.11 D): the next backup's estimate no longer fits under one of
      # the two budget limits the last backup run recorded, so that run is refused before writing.
      - alert: BackupBudgetLow
        expr: backup_budget_headroom_bytes < 0
        for: 1h
        labels:
          severity: warning

      # §42 "disk free low" (ADR-0064 10.11 F): 7.5 GiB = the runbook value of
      # HUMAUX_MAINTENANCE_RESTORE_MIN_FREE_DISK_BYTES: page while a restore of today's database and several 2 GiB
      # WAL queues still fit, whatever the cause.
      - alert: DiskFreeLow
        expr: backup_disk_free_bytes{volume="pgdata"} < 8053063680
        for: 15m
        labels:
          severity: critical

      # §42 "admission rejected（单机档）" (card 38, ADR-0065 D-C) as M22-3 D3 replaces it (G-M22-3): the refusal must be
      # a *ratio* of attempts, not a count, so one 503 never mails. Numerator: §67.2 refusals that name a capacity bound
      # (`reason` queue_full | wait_timeout, §41.2) — `key_limit` is the per-key rate policy D3 excludes. Denominator:
      # every inbound attempt that reached a tool call (humaux_mcp_requests_total) plus every refusal, so a gateway whose
      # traffic is entirely refused reads 1. `changes(...) > 1` is the gate's own condition: at any traffic level a
      # single refusal is not a ratio (one attempt ⇒ 100 %) and must not page. sum() drops the reason labels.
      # `reason!="key_limit"` is D3's exclusion: quota/rate policy is not a capacity bound (§67.2).
      # ponytail: the 2 m / 1 m holds and `changes(...) > 1` are lead-approved starting values pending X-M22-3;
      # the note gives the ratio window and the exclusion, not a hold or a count guard.
      - alert: CapacityRejectionRatioHigh
        expr: sum(rate(admission_rejected_total{reason!="key_limit"}[15m])) / (sum(rate(humaux_mcp_requests_total[15m])) + sum(rate(admission_rejected_total[15m]))) > 0.005 and sum(changes(admission_rejected_total{reason!="key_limit"}[15m])) > 1
        for: 2m
        labels:
          severity: warning

      # Same ratio over the critical window (D3: >2 % / 5 m), held 1 m.
      - alert: CapacityRejectionRatioCritical
        expr: sum(rate(admission_rejected_total{reason!="key_limit"}[5m])) / (sum(rate(humaux_mcp_requests_total[5m])) + sum(rate(admission_rejected_total[5m]))) > 0.02 and sum(changes(admission_rejected_total{reason!="key_limit"}[5m])) > 1
        for: 1m
        labels:
          severity: critical

      # §42 "DNS pin deferred" (card 39, ADR-0066 D-P): distill jobs keep deferring on TRANSPORT while a DNS pin is
      # configured and no memory record is written — the pinned address (or the provider) is unreachable, not a single
      # blip. Both families are exported by humaux-private-worker; refresh procedure: runbook §O-DNS.
      - alert: DnsPinDeferred
        expr: increase(dns_pin_deferred_total[30m]) > 0 and increase(private_distill_outputs_total[30m]) == 0
        for: 15m
        labels:
          severity: warning

  # M22-3 D3/D4 (module_design_M22 l.100 / l.108): the host's own capacity. Not §42 rows — the numeric
  # thresholds are B23 starting values kept as deploy config (§78.1); X-M22-3 replaces them with the measured knee.
  # Sources: host_cpu_busy_ratio, host_memory_available_bytes, host_pressure_ratio (M22-1) and tenants_active_7d
  # (M22-2). A missing /proc source is an absent family (G-M22-1), so its rule is silent, never 0.
  - name: humaux-capacity
    rules:
      # D4 headroom per resource: the distance to the warning line, in the resource's own unit. D4's formula is a
      # ceiling budget over busy-window demand; only the CPU busy line (0.70) and the PSI cpu some line (0.20) have
      # that pair, so memory and disk stay byte headroom (M22-4's weekly report carries the bytes).
      # ponytail: the 7.5 GiB disk floor is a lead-approved starting value (the §42 DiskFreeLow runbook value)
      # pending X-M22-3 data; it is not a second threshold.
      - record: capacity:headroom_cpu_ratio
        expr: 0.70 - host_cpu_busy_ratio

      - record: capacity:headroom_memory_bytes
        expr: host_memory_available_bytes - 4294967296

      - record: capacity:headroom_psi_cpu_ratio
        expr: 0.20 - host_pressure_ratio{resource="cpu",kind="some"}

      - record: capacity:headroom_disk_bytes
        expr: backup_disk_free_bytes{volume="pgdata"} - 8053063680

      # D4 (B23): additional users = min over resources of (safe budget − current) / (current / tenants_active_7d).
      # The two resources with a ceiling budget and a busy-window demand are CPU busy (0.70) and PSI cpu some (0.20).
      # `max by (instance)` on every operand keeps the per-host series the scrape actually produces (job, mode and
      # instance) equal on both sides of each division; without it a {job,mode,instance} operand never matches a {}
      # tenant gauge and the term silently disappears. label_replace gives each term a resource label so `or` keeps
      # both, and min() collapses them to the one sample the report reads.
      # The `and on (instance) (... > 0)` guards exclude zero denominators: busy 0 gives +Inf and tenants 0 gives
      # +Inf/NaN, and a host with no demand has no finite additional-user count, so the rule emits no sample there
      # rather than a made-up one (§4.4 "not scanned" ≠ "none").
      # ponytail: the linear model is a lead-approved starting value; replace it after X-M22-3 if off by >25 %.
      - record: capacity:additional_users
        expr: >-
          min(
          label_replace(
          ((0.70 - max by (instance) (host_cpu_busy_ratio)) / (max by (instance) (host_cpu_busy_ratio) / max by (instance) (tenants_active_7d)))
          and on (instance) (max by (instance) (host_cpu_busy_ratio) > 0)
          and on (instance) (max by (instance) (tenants_active_7d) > 0),
          "resource", "cpu_busy", "", "")
          or
          label_replace(
          ((0.20 - max by (instance) (host_pressure_ratio{resource="cpu",kind="some"})) / (max by (instance) (host_pressure_ratio{resource="cpu",kind="some"}) / max by (instance) (tenants_active_7d)))
          and on (instance) (max by (instance) (host_pressure_ratio{resource="cpu",kind="some"}) > 0)
          and on (instance) (max by (instance) (tenants_active_7d) > 0),
          "resource", "cpu_psi", "", "")
          )

      # D3 CPU warning: >70 % busy for 15 m. `for:` is spelled in seconds on this one row so mutations.sh's
      # drop-`for:` token occurs exactly once (the `lag` row keeps the only 10 m token, ADR-0063 D-F).
      - alert: CapacityCpuBusyHigh
        expr: host_cpu_busy_ratio > 0.70
        for: 900s
        labels:
          severity: warning
          resource: cpu

      # D3 CPU critical: >85 % for 5 m **with** PSI cpu some >20 % as corroboration. The left side keeps the scrape
      # labels {job,mode,instance}; `and on (instance)` matches the PSI term, which is aggregated by instance for
      # exactly that reason (a bare min() would carry {} and the alert would never fire). The result keeps the left
      # labels, so the alert is per host. If PSI is unreadable the family is absent and this row stays silent (the
      # M22-1 fallback covers that host, G-M22-1).
      - alert: CapacityCpuBusyCritical
        expr: host_cpu_busy_ratio > 0.85 and on (instance) min by (instance) (host_pressure_ratio{resource="cpu",kind="some"}) > 0.20
        for: 300s
        labels:
          severity: critical
          resource: cpu

      # D3 memory: MemAvailable <4 GiB warn / <2 GiB crit.
      # ponytail: the 15 m / 5 m holds are lead-approved starting values pending X-M22-3; the note gives no memory
      # window.
      - alert: CapacityMemoryLow
        expr: host_memory_available_bytes < 4294967296
        for: 15m
        labels:
          severity: warning
          resource: memory

      - alert: CapacityMemoryCritical
        expr: host_memory_available_bytes < 2147483648
        for: 5m
        labels:
          severity: critical
          resource: memory
