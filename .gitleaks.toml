# Secret-scan config for the `gitleaks secret scan` step of ci.yml and for .github/workflows/secret-scan.yml
# (M24-2, gate G-M24-2; module design M24 D2). Default ruleset; the only exemptions are the deliberate FAKE vectors
# below. Changes to THIS file are reviewed like code: a PR can exempt its own finding by editing it, and the scan reads
# the PR's copy. Never exempt a rule globally, by a directory or by a broad regex: a new fixture file adds an entry.
# Every entry is as narrow as its finding allows: rule (targetRules) AND exact path AND, for the tokens, the exact
# synthetic value (written with one character in brackets, so this file does not match the rule it exempts), so a
# different token added to the same file still fires. Commit-scoped entries cover history only.
# ponytail: the private-key entry is path + rule only (multi-line value), tighten it if that fixture grows.
title = "humaux-thread gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "The one synthetic GitHub-shaped token (FAKE_GITHUB_TOKEN consts, CRED_FAKE in the rehearsal) that proves the scanners refuse it"
condition = "AND"
targetRules = ["github-pat"]
regexTarget = "secret"
regexes = ['''^ghp_RkqFzVpLwNyHtBvDgX[s]WuCePjMoTnAiSyEkl$''']
paths = [
  '''^bins/gateway/tests/mcp_gateway\.rs$''',
  '''^bins/gateway/tests/query_embedding_rpc\.rs$''',
  '''^crates/adapters/tests/contribution_scan\.rs$''',
  '''^crates/adapters/tests/projection_worker\.rs$''',
  '''^crates/local-secret-scan/tests/seal_rules\.rs$''',
  '''^docs/ops/rehearse\.sh$''',
]

[[allowlists]]
description = "Synthetic PEM block (FAKE_PRIVATE_KEY, 'not a key') for the projection worker source-seal test"
targetRules = ["private-key"]
paths = ['''^crates/adapters/tests/projection_worker\.rs$''']

[[allowlists]]
description = "The one Slack-shaped payload the contribution pipeline failure test must refuse"
condition = "AND"
targetRules = ["slack-bot-token"]
regexTarget = "secret"
regexes = ['''^xoxb-12345678[9]012-123456789012-abcdefghijklmnopqrstuvwx$''']
paths = ['''^crates/adapters/tests/contribution_pipeline\.rs$''']

[[allowlists]]
description = "generic-api-key false positive, history only: the devlocal_<role> test login password (b65c88d)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["b65c88d3486e9c78a5f04a0883ce0f4b5af026b5"]
paths = ['''^crates/adapters/tests/project_continuity_read_0137_acceptance\.rs$''']

[[allowlists]]
description = "generic-api-key false positive, history only: an ADR sentence quoting a const name (2c8eba7)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["2c8eba79b3845fccc03803f54a32f458a35ce778"]
paths = ['''^docs/adr/0056-retrieval-egress-seal-secrets-only\.md$''']

[[allowlists]]
description = "generic-api-key false positive: the published sha256 of the rerank tokenizer.json, a public file hash (ADR-0084 D-A) whose variable name contains 'token'"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^62c24cdc13d4c9952d63718d6c9fa4c287974249e16b7ade6d5a85e7bbb7[5]626$''']
paths = ['''^deploy/env/values/retrieval-worker\.env$''']
