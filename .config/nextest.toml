# T-CI-1 (§46): xtask's tests spawn nested `cargo` (cargo run -p xtask, cargo run -p humaux-*) into the SAME target dir, and the
# child inherits the CARGO_MANIFEST_DIR / CARGO_PKG_* that nextest exports to every test. ring's build script tracks them
# (`cargo:rerun-if-env-changed`), so the first nested cargo re-records ring under the xtask values and the NEXT
# `cargo nextest run` rebuilds ring, rustls, reqwest and every workspace crate above them (diag run 39433240461: "Dirty ring
# v0.17.14: the env variable CARGO_MANIFEST_DIR changed", 69 s in test-a). Nothing reads those variables at run time (they are all
# compile-time `env!`), so the xtask tests run without them. This is the only change to their environment.
[scripts.wrapper.no-cargo-pkg-env]
command = ['env', '-u', 'CARGO_MANIFEST_DIR', '-u', 'CARGO_PKG_NAME', '-u', 'CARGO_PKG_VERSION', '-u', 'CARGO_PKG_VERSION_MAJOR', '-u', 'CARGO_PKG_VERSION_MINOR', '-u', 'CARGO_PKG_VERSION_PATCH', '-u', 'CARGO_PKG_VERSION_PRE', '-u', 'CARGO_PKG_AUTHORS', '-u', 'CARGO_PKG_DESCRIPTION', '-u', 'CARGO_PKG_HOMEPAGE', '-u', 'CARGO_PKG_REPOSITORY', '-u', 'CARGO_PKG_LICENSE', '-u', 'CARGO_PKG_LICENSE_FILE']

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "fail"
final-status-level = "slow"

[[profile.ci.overrides]]
filter = 'binary_id(humaux-adapters) | binary_id(humaux-adapters::a2_point_identity) | binary_id(humaux-adapters::auth_scope_rls) | binary_id(humaux-adapters::authority_g59_5) | binary_id(humaux-adapters::contribution_authorization) | binary_id(humaux-adapters::contribution_execution_0131) | binary_id(humaux-adapters::contribution_pipeline) | binary_id(humaux-adapters::contribution_policy_lifecycle_0132) | binary_id(humaux-adapters::contribution_repo) | binary_id(humaux-adapters::contribution_self_principal_authority_0133) | binary_id(humaux-adapters::disclosure_ledger) | binary_id(humaux-adapters::distill_dispatch_v2) | binary_id(humaux-adapters::email_outbox) | binary_id(humaux-adapters::evidence_sources) | binary_id(humaux-adapters::evidence_sources_dedupe) | binary_id(humaux-adapters::evidence_task_runs) | binary_id(humaux-adapters::exact_completeness_eval) | binary_id(humaux-adapters::g80_31_handoff) | binary_id(humaux-adapters::health_snapshot) | binary_id(humaux-adapters::jobs_claim) | binary_id(humaux-adapters::maintenance_doors) | binary_id(humaux-adapters::membership_lifecycle) | binary_id(humaux-adapters::memory_affects) | binary_id(humaux-adapters::memory_attribution) | binary_id(humaux-adapters::memory_subjects_link) | binary_id(humaux-adapters::minimax_live_smoke) | binary_id(humaux-adapters::model_call_ledger) | binary_id(humaux-adapters::note_history) | binary_id(humaux-adapters::note_put) | binary_id(humaux-adapters::note_reads) | binary_id(humaux-adapters::note_replace) | binary_id(humaux-adapters::note_text_once) | binary_id(humaux-adapters::operation_receipts) | binary_id(humaux-adapters::outbox_batch_remember) | binary_id(humaux-adapters::phase9_assessed_contract) | binary_id(humaux-adapters::phase9_exact_assessed_storage_binding) | binary_id(humaux-adapters::private_projection_registry) | binary_id(humaux-adapters::project_continuity_0136) | binary_id(humaux-adapters::project_continuity_read_0137_acceptance) | binary_id(humaux-adapters::project