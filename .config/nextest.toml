# cargo-nextest profiles (M24 test-speed trial). nextest runs every test in its own process and test
# binaries in parallel; cargo test ran binaries one after another and threads inside one process. Two
# consequences, both handled with test groups (max-threads = 1):
#  - global-db: binaries that share cluster-global state (the 4 fixed provider slots, global append, outbox/job
#    tables) and were only safe because no other binary ran at the same time (run 38626567082: 54 failures,
#    "N provider slot(s) are bound to live claims"); run 38631492042 widened it to every binary that enqueues or
#    claims derived jobs (21 failures left when only the obvious 12 were grouped).
#  - serial-<binary>: binaries whose tests serialise on an in-process static Mutex, which a per-test process
#    no longer shares.

# ponytail: global-db serialises ~60 binaries — ceiling: test-a wall time; upgrade = card M24-7a/7b (template DB per
#   test binary, provider-slot fixtures per DB), after which global-db shrinks toward 0. Until then the per-binary
#   serial-* groups below are shadowed for every binary that global-db also matches (first matching override wins),
#   and the maintenance entries only matter if maintenance moves to nextest. Completeness is not gated yet (a new
#   binary is ungrouped by default) — M24-7 adds that gate. Groups exist only in profile `ci`.
#  - global-db also holds M08-3's read_gate_closure and cross_tenant_canary: each seeds real tenants through the
#    operation_receipt fixture (and, for the closure test, the continuity fixture), whose teardown toggles
#    triggers on shared tables (control.audit_events, the continuity append-only guards).
#  - global-db also holds the consumers of tests/support/operation_receipt_fixture.rs (its static SERIAL toggles
#    triggers on shared tables during teardown) — independent review of PR #33.

[test-groups]
global-db = { max-threads = 1 }
serial-consolidate-snapshot = { max-threads = 1 }
serial-contribution-pipeline = { max-threads = 1 }
serial-contribution-policy-lifecycle-0132 = { max-threads = 1 }
serial-contribution-reasoner = { max-threads = 1 }
serial-contribution-repo = { max-threads = 1 }
serial-health-snapshot = { max-threads = 1 }
serial-mechanism-observation = { max-threads = 1 }
serial-phase9-exact-assessed-storage-binding = { max-threads = 1 }
serial-phase9-independence-attestation = { max-threads = 1 }
serial-public-provenance = { max-threads = 1 }
serial-public-runtime = { max-threads = 1 }
serial-public-runtime-qdrant = { max-threads = 1 }
serial-public-trust = { max-threads = 1 }
serial-quota-and-rate = { max-threads = 1 }
serial-rebuild = { max-threads = 1 }
serial-selection-snapshot = { max-threads = 1 }
serial-probes = { max-threads = 1 }
serial-mcp-gateway = { max-threads = 1 }
serial-drill = { max-threads = 1 }
serial-onboarding = { max-threads = 1 }
serial-reasoning-routes = { max-threads = 1 }
serial-contribution-execution-runner = { max-threads = 1 }
serial-start-manual-contribution-command-0131 = { max-threads = 1 }

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
status-level = "fail"
final-status-level = "slow"

[[profile.ci.overrides]]
filter = 'binary_id(humaux-adapters) | binary_id(humaux-adapters::auth_scope_rls) | binary_id(humaux-adapters::contribution_authorization) | binary_id(humaux-adapters::contribution_execution_0131) | binary_id(humaux-adapters::contribution_pipeline) | binary_id(humaux-adapters::contribution_policy_lifecycle_0132) | binary_id(humaux-adapters::contribution_repo) | binary_id(humaux-adapters::contribution_self_principal_authority_0133) | binary_id(humaux-adapters::disclosure_ledger) | binary_id(humaux-adapters::distill_dispatch_v2) | binary_id(humaux-adapters::email_outbox) | binary_id(humaux-adapters::g80_31_handoff) | binary_id(humaux-adapters::health_snapshot) | binary_id(humaux-adapters::jobs_claim) | binary_id(humaux-adapters::maintenance_doors) | binary_id(humaux-adapters::membership_lifecycle) | binary_id(humaux-adapters::memory_affects) | binary_id(humaux-adapters::memory_subjects_link) | binary_id(humaux-adapters::minimax_live_smoke) | binary_id(humaux-adapters::model_call_ledger) | binary_id(humaux-adapters::note_history) | binary_id(humaux-adapters::note_put) | binary_id(humaux-adapters::note_reads) | binary_id(humaux-adapters::note_replace) | binary_id(humaux-adapters::operation_receipts) | binary_id(humaux-adapters::outbox_batch_remember) | binary_id(humaux-adapters::phase9_assessed_contract) | binary_id(humaux-adapters::phase9_exact_assessed_storage_binding) | binary_id(humaux-adapters::project_continuity_0136) | binary_id(humaux-adapters::project_continuity_read_0137_acceptance) | binary_id(humaux-adapters::projection_claim) | binary_id(humaux-adapters::projection_lag) | binary_id(humaux-adapters::projection_worker) | binary_id(humaux-adapters::public_provenance) | binary_id(humaux-adapters::public_runtime) | binary_id(humaux-adapters::read_gate_closure) | binary_id(humaux-adapters::reasoning_route_foundation) | binary_id(humaux-adapters::reasoning_route_health_admission) | binary_id(humaux-adapters::reasoning_route_runtime) | binary_id(humaux-adapters::request_guard) | binary_id(humaux-adapters::scheduler_exactly_once) | binary_id(humaux-adapters::stream_repo) | binary_id(humaux-adapters::task_grant_contract) | binary_id(humaux-adapters::visible_index_count) | binary_id(humaux-consolidation-worker) | binary_id(humaux-consolidation-worker::consolidation_hop_e2e) | binary_id(humaux-consolidation-worker::derived_dispatch_e2e) | binary_id(humaux-consolidation-worker::run_once_e2e) | binary_id(humaux-gateway::continuity_get) | binary_id(humaux-gateway::cross_tenant_canary) | binary_id(humaux-gateway::read_decoupling) | binary_id(humaux-gateway::semantic_recall_wiring) | binary_id(humaux-gateway::service_credentials) | binary_id(humaux-private-worker) | binary_id(humaux-private-worker::bin/humaux-private-worker) | binary_id(humaux-private-worker::contribution_execution_runner) | binary_id(humaux-private-worker::derived_dispatch_e2e) | binary_id(humaux-private-worker::distill_hop_e2e) | binary_id(humaux-private-worker::ops_listener) | binary_id(humaux-private-worker::same_uid_boot) | binary_id(humaux-private-worker::start_manual_contribution_command_0131) | binary_id(humaux-testkit)'
