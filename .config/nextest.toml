experimental = ["wrapper-scripts"]

# cargo-nextest profiles (M24 test-speed trial). nextest runs every test in its own process and test
# binaries in parallel; cargo test ran binaries one after another and threads inside one process. Two
# consequences, both handled with test groups (max-threads = 1):
#  - global-db: binaries that share cluster-global state (the 4 fixed provider slots, global append, outbox/job
#    tables) and were only safe because no other binary ran at the same time (run 38626567082: 54 failures,
#    "N provider slot(s) are bound to live claims"); run 38631492042 widened it to every binary that enqueues or
#    claims derived jobs (21 failures left when only the obvious 12 were grouped).
#  - serial-<binary>: binaries whose tests serialise on an in-process static Mutex, which a per-test process
#    no longer shares.

# ponytail: global-db serialises ~70 binaries — ceiling: test-a wall time; upgrade = card M24-7a/7b (template DB per
#   test binary, provider-slot fixtures per DB), after which global-db shrinks toward 0. Until then the per-binary
#   serial-* groups below are shadowed for every binary that global-db also matches (first matching override wins),
#   and the maintenance entries only matter if maintenance moves to nextest. Completeness is gated by
#   `cargo xtask architecture-check` (M24-7 / G-M24-7, xtask/src/architecture_check.rs `m24_7_global_db_completeness`):
#   a binary whose sources carry a derived-job, outbox or provider-slot marker (the state named above, not every kind of
#   cluster-global state: at #145, 36 of the 67 integration binaries in global-db carry one and the rest were grouped from
#   observed failures) must be matched by the global-db filter below or be a row of GLOBAL_DB_EXEMPT there, and a
#   binary_id that names no binary is red. global-db serialises a binary only against its own members, so DDL on the
#   shared catalog is not covered by it: M24-7b (#145, same function) wants such a statement inside a
#   lane(a:disposable) test, run by `cargo xtask serial-lane`. Groups exist only in profile `ci`; an override that
#   carries test-group must carry exactly filter and test-group (the gate reads no other key) and is red otherwise.
#  - global-db also holds M08-3's read_gate_closure and cross_tenant_canary: each seeds real tenants through the
#    operation_receipt fixture (and, for the closure test, the continuity fixture), whose teardown toggles
#    triggers on shared tables (control.audit_events, the continuity append-only guards).
#  - global-db also holds the consumers of tests/support/operation_receipt_fixture.rs (its static SERIAL toggles
#    triggers on shared tables during teardown) — independent review of PR #33.
#  - global-db also holds humaux-gateway::mcp_gateway, humaux-adapters::evidence_task_runs and memory_attribution
#    (#101, PR #99): a remember.put writes an EVIDENCE_ACCEPTED outbox row (adapters::stream_repo), whose 0164/0235
#    trigger enqueues a DERIVED_DISTILL job and whose 0190 trigger admits the tenant to ops.distill_tenant_scheduler,
#    work distill_dispatch_v2's cross-tenant claim can serve (its fence locks only pre-existing scheduler rows).
#  - global-db also holds humaux-private-worker::m29_attribution_e2e (M29 T07): it puts through the operation_receipt
#    fixture and drives the cross-tenant distill claim.
#  - global-db also holds humaux-adapters::note_text_once (M07-2): it puts notes through the operation_receipt fixture.
#  - global-db also holds humaux-adapters::evidence_sources_dedupe (M06-1b): sourced puts through the operation_receipt fixture.
#  - global-db also holds the six binaries the first run of the completeness gate found ungrouped (#101, M24-7):
#    humaux-adapters::a2_point_identity and switch_user_private (a2_fixture's shared-database Fixture drives remember()),
#    humaux-adapters::retrieve_read_your_writes, private_projection_registry and exact_completeness_eval (each seeds
#    EVIDENCE_ACCEPTED outbox rows straight into the shared database), and humaux-gateway::coordinate_task (the
#    operation_receipt fixture's remember.put seeding and trigger-toggling teardown).
#  - global-db also holds humaux-adapters::recall_envelope_g23 (M08-4, DOD-013): it calls remember() directly and
#    seeds that write's Memory link, so the same EVIDENCE_ACCEPTED outbox row and DERIVED_DISTILL enqueue apply.

[test-groups]
global-db = { max-threads = 1 }
serial-consolidate-snapshot = { max-threads = 1 }
serial-contribution-pipeline = { max-threads = 1 }
