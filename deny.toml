# cargo-deny config (§78.5): unknown registry/git deny, wildcard dependency deny,
# license allowlist (permissive only), advisory deny, duplicate warn. Blocking in CI since M24-1.
# Run via `cargo xtask` gate wiring / CI `cargo-deny check` step (§46).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # M24-1 (main run 38606451978): all permissive, no copyleft — MIT-0 (borrow-or-share via jsonschema),
    # Zlib (foldhash 0.1.5 / 0.2.0), 0BSD (quoted_printable), CDLA-Permissive-2.0 (webpki-roots data).
    "MIT-0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Workspace members are publish = false and carry no licence until the repo split: they are ours, not deps.
private = { ignore = true }

[bans]
# §78.5: 重复依赖必须带原因/expiry exception — 默认只 warn，收紧成 deny 需逐条登记 skip。
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies of unpublished members are not wildcards in any meaningful sense (16 errors on run
# 38606451978 were all internal paths); registry dependencies stay `wildcards = "deny"`.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
