# cargo-deny config (§78.5): unknown registry/git deny, wildcard dependency deny,
# license allowlist (permissive only), advisory deny, duplicate warn. Blocking in CI since M24-1.
# Run via `cargo xtask` gate wiring / CI `cargo-deny check` step (§46).

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# §78.5: a new RustSec advisory blocks every PR. Fix = bump the lock; only if no fixed version exists, add an
# entry here with the advisory id, the reason and an expiry date, and a card to remove it.
# cargo-deny has no expiry field, so the expiry date and the removal card sit in the reason string.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "ADR-0084 D-B: `paste` 1.0.15 (unmaintained, no patched version) is a normal dependency of `tokenizers` 0.23.2, which the retrieval-worker needs for the local rerank lane; the alternative is the pre-release `tokenizers` 1.0.0-rc.3 family. Expires 2027-04-30. Removal card: move to a tokenizers release without paste." },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # M24-1: all permissive, no copyleft — MIT-0 (borrow-or-share via jsonschema),
    # Zlib (foldhash 0.1.5 / 0.2.0), 0BSD (quoted_printable), CDLA-Permissive-2.0 (webpki-roots data).
    "MIT-0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# ADR-0073 D-C: members are publish = false and carry no licence until the split — ours, not dependencies.
private = { ignore = true }

[bans]
# §78.5: 重复依赖必须带原因/expiry exception — 默认只 warn，收紧成 deny 需逐条登记 skip。
multiple-versions = "warn"
wildcards = "deny"
# Path (and git) dependencies of unpublished members are exempt from the wildcard ban; registry dependencies are
# not. Git dependencies stay impossible only because [sources] denies unknown git with allow-git = [] — adding to
# allow-git removes that backstop for wildcard git deps.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
